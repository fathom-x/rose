# cargo-audit configuration (for local `cargo audit` runs; CI uses `cargo deny`,
# whose deny.toml documents the same advisory exceptions).

[advisories]
# RUSTSEC-2026-0374: `basic-toml` unmaintained, reached only through `age`'s compile-time
# i18n configuration parser (`i18n-embed-fl` -> `i18n-config`); no upgrade exists yet.
# RUSTSEC-2026-0387: `crypto-bigint` 0.5 timing, reached only via age's P-256 recipients,
# which rose never uses.
# RUSTSEC-2026-0459: SQLite WAL page-size disclosure, which needs a crafted database + `-wal`
# pair; rose opens only files it creates in its own datadir.
# RUSTSEC-2023-0071: `rsa` 0.9 timing, only in `rose-petal` via `pgp`, holder-local private-key
# operations with no remote timing oracle; no `pgp` release on `rsa` 0.10 yet.
# RUSTSEC-2021-0127: `serde_cbor` unmaintained, a `rose-petal` dev-dependency only.
# The rationale is in deny.toml, which CI enforces; keep the two lists identical.
ignore = ["RUSTSEC-2026-0374", "RUSTSEC-2026-0387", "RUSTSEC-2026-0459", "RUSTSEC-2023-0071", "RUSTSEC-2021-0127"]
