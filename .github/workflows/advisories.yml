name: Advisories

# The dependency advisories, on a timer. The `deny` job in ci.yml runs `cargo deny check`
# only when code moves (a push to main or a pull request), so an advisory published against
# a crate the lockfile already pins is noticed the next time something happens to land, which
# can be weeks: RUSTSEC-2026-0381/0382 (emSign) were published on 2026-10-19 and seen on
# 2026-10-20 only because a merge happened to push to main that day. This workflow runs the
# advisory check alone every day, against the default branch's lockfile, and opens (or
# updates) one issue when it fails, so the failure reaches the tracker rather than only the
# workflow's author by email. Licenses, bans and sources stay with ci.yml: they change only
# when the lockfile does.
#
# What a failure means: a dependency has a RustSec advisory (a vulnerability, or an
# unmaintained-crate notice, which deny.toml also treats as an error). The answer is a
# `cargo update -p <crate>` to the fixed release where one exists, or an exception with its
# rationale in deny.toml (mirrored in .cargo/audit.toml) where none does - never a silent
# ignore. Dependabot (.github/dependabot.yml) opens the bump PR for the first case when it
# can; this check is the net under both.

on:
  schedule:
    # Daily, 05:41 UTC (an off-peak odd minute).
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check advisories
        id: check
        # Captured rather than failing the step, so the issue step below runs with the output
        # and the job still fails afterwards.
        run: |
          set +e
          cargo deny check advisories 2>&1 | tee deny.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # One open issue per failure streak: created on the first failing day, updated with a
      # comment on later ones so the tracker shows one item, not one per day. Closing it
      # acknowledges the streak; the next failure opens a new one.
      - name: Open or update the tracking issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="cargo deny: dependency advisories on main"
          {
            echo "The daily advisory check failed: $RUN_URL"
            echo
            echo '```'
            # The advisory report; the per-crate dependency trees are what the log is mostly
            # made of, so keep the first 200 lines.
            head -n 200 deny.log
            echo '```'
            echo
            echo "Fix: \`cargo update -p <crate>\` to the fixed release, or an exception with its rationale in deny.toml (mirrored in .cargo/audit.toml). Regenerate THIRD-PARTY-LICENSES.txt if the crate set changes."
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "updated #$existing"
          else
            gh issue create --title "$title" --label dependencies --body-file body.md \
              || gh issue create --title "$title" --body-file body.md
          fi

      - name: Fail the job on advisories
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::cargo deny check advisories failed; see the tracking issue"
          exit 1
