name: Docker

# Builds both Docker images and smoke-tests the two binaries in each, mirroring zallet's
# test-docker-container workflow:
#   - Dockerfile - the reproducible StageX build (amd64 only; StageX publishes
#                         no arm64 images yet)
#   - Dockerfile.arm64 - the reproducible static-musl Alpine build for ARM hosts (pinned
#                         base + apk toolchain; not StageX-grade trust), run natively on a
#                         GitHub arm64 runner
# The full static release builds are slow, so this only runs when the image inputs
# change (the crate itself is built and tested by CI on every PR).

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.arm64
      - .dockerignore
      # the license texts the runtime stage COPYs into /usr/share/doc/rose
      - THIRD-PARTY-LICENSES.txt
      - LICENSE-*
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
      # the configs the smoke test feeds to `rose config check` in the container
      - deploy/rose.toml
      - deploy/rose.btc-mainnet-view.toml
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - Dockerfile.arm64
      - .dockerignore
      # the license texts the runtime stage COPYs into /usr/share/doc/rose
      - THIRD-PARTY-LICENSES.txt
      - LICENSE-*
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
      # the configs the smoke test feeds to `rose config check` in the container
      - deploy/rose.toml
      - deploy/rose.btc-mainnet-view.toml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# contents:read is required for checkout - this repo is private, so zallet's
# `permissions: {}` pattern strips even repo read access from GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build_and_run:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stagex-amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile
          - name: alpine-musl-arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -f ${{ matrix.dockerfile }} -t rose .

      - name: Run both binaries inside the container
        run: |
          docker run --rm rose --version
          docker run --rm --entrypoint rose rose --version

      # `--version` proves the static binaries load; it touches nothing else. The first thing
      # rose does on a real host is read a config file, so check one - `config check` parses a
      # production-shaped config, resolves every default and probes the datadir, and is
      # read-only (no datadir lock, no wallet DB, no cookie file), so it is safe to run in a
      # throwaway container and is the cheapest proof that the runtime image is more than a
      # version stamp. deploy/rose.toml is the file the compose stack mounts at this path.
      # ROSE_RPC_PASSWORD stands in for the one value the sample leaves as a placeholder - rose
      # refuses to start on CHANGE-ME on every network, and the compose stack supplies the
      # real password the same way (deploy/.env).
      - name: Check a production config inside the container
        run: |
          docker run --rm -e ROSE_RPC_PASSWORD=smoke-test --entrypoint rose \
            -v "$PWD/deploy/rose.toml:/etc/rose/rose.toml:ro" rose \
            config check --conf /etc/rose/rose.toml

      # The images carry both wallet engines (`--features mimalloc-secure,bitcoin,zcash` in
      # both Dockerfiles) where a default `cargo build` carries Bitcoin alone - so the Zcash
      # config above already proves the opt-in engine shipped. Check a config that selects the
      # Bitcoin engine too: a binary built without a feature refuses its `coin` at config
      # resolve ("this build supports: ..."), so both steps going green is the proof that both
      # engines are in the image.
      - name: Check a Bitcoin config inside the container
        run: |
          docker run --rm -e ROSE_RPC_PASSWORD=smoke-test --entrypoint rose \
            -v "$PWD/deploy/rose.btc-mainnet-view.toml:/etc/rose/rose.toml:ro" rose \
            config check --conf /etc/rose/rose.toml

      - name: Extract static binaries via the export stage
        run: |
          docker build -f ${{ matrix.dockerfile }} --target export -o ./out .
          test -x out/rosed && test -x out/rose
          file out/rosed out/rose

      # Logged so any two runs of the same commit can be diffed by hand - they should
      # be bit-for-bit identical (the i18n-embed-fl nondeterminism that once needed a
      # vendored patch is fixed upstream as of age 0.12; see the project docs "Gotchas").
      - name: Print binary hashes
        run: sha256sum out/rosed out/rose
