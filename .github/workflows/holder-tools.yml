# The shard holder's two tools (the `rose-petal` crate: `rose-petal`, the shard client, and
# `attestation-check`, the attestation checker), built for the platforms a holder releases a
# shard from and published as a release named after this commit (holder-tools-<sha7>). The
# release is not what a holder trusts: a deployment repository pins its hashes under its own
# signature, and its holders require the commit it was built from to be signed by a key in
# contrib/verify-commits/ (so only a release built from a signed commit can be pinned: after
# merging a change, dispatch this on a signed commit). Runs on every push, to any branch, that
# changes the crate, the lockfile, the build script or this file, so a change is built before
# its pull request is reviewed, and on dispatch.
#
#   linux-amd64   contrib/holder-tools/build.sh: a clean export of the tree in the pinned
#                 rust:alpine image Dockerfile.arm64 uses, static musl, reproducible (a
#                 deployment's pin rebuilds it and requires the same bytes).
#   darwin-arm64  a macOS runner with plain cargo on the pinned 1.97.1 toolchain and the
#                 same determinism flags; no C library beyond the system's (the crate's
#                 only C is ring's). Expected to reproduce on another Mac with the same
#                 toolchain; a deployment's manifest says which platforms a release has, and
#                 a release without this asset still serves Linux holders.
name: holder-tools

on:
  push:
    paths:
      - rose-petal/**
      - Cargo.lock
      - contrib/holder-tools/**
      - .github/workflows/holder-tools.yml
  workflow_dispatch:

concurrency:
  group: holder-tools-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # the release and its tag

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build both binaries reproducibly and take them out
        run: |
          contrib/holder-tools/build.sh --out out
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: out/*
          if-no-files-found: error

  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build with the pinned toolchain
        env:
          RUSTUP_TOOLCHAIN: "1.97.1"
          SOURCE_DATE_EPOCH: "1"
          CARGO_INCREMENTAL: "0"
          # The checkout and the cargo home are the two paths a binary could embed.
          RUSTFLAGS: "-C codegen-units=1 --remap-path-prefix=${{ github.workspace }}=/usr/src/rose --remap-path-prefix=${{ env.HOME }}/.cargo=/usr/local/cargo"
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo --version
          cargo build --release --locked -p rose-petal --bins
          mkdir -p out
          cp target/release/rose-petal out/rose-petal-darwin-arm64
          cp target/release/attestation-check out/attestation-check-darwin-arm64
          shasum -a 256 out/*
          # A holder's Mac has none of the build machine's libraries: only system ones may be linked.
          for b in out/*; do
            otool -L "$b"
            if otool -L "$b" | tail -n +2 | grep -v '/usr/lib/\|/System/Library/'; then echo "::error::$b links a library outside the system"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: out/*
          if-no-files-found: error

  release:
    needs: [linux-amd64, darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release holder-tools-<sha7> with every built asset and their SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=holder-tools-${GITHUB_SHA::7}
          (cd out && sha256sum * | tee SHA256SUMS)
          platforms=$(ls out | sed -n 's/^attestation-check-//p' | tr '\n' ' ')
          notes="The shard holder's tools (the rose-petal crate: rose-petal and attestation-check) built from $GITHUB_SHA by the holder-tools workflow: platforms $platforms. Not what a holder trusts by itself: a deployment repository pins these hashes under its own signature (rose-deploy: scripts/holder-tools.sh pin $tag), and its holders require $GITHUB_SHA to be signed by a key in contrib/verify-commits/."
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber out/*
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" out/*
          fi
