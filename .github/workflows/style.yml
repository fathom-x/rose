name: Style

# House style: ASCII punctuation only (the project docs § Authoring conventions).
#
# Deliberately its own workflow rather than a job in ci.yml: that workflow's `paths-ignore`
# skips `**.md`, `docs/**`, `deploy/**` and the sample config, which is precisely where prose
# (and therefore an em-dash) is most likely to land. No ignores here - every path is checked.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  punctuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pattern is built with printf rather than written literally so this file does not
      # match its own check, and by byte value rather than as a PCRE `\x{2014}` because
      # `git grep -P` only interprets that escape under a UTF-8 locale - on a C-locale runner
      # it aborts with "character code point value ... is too large", which silently turns the
      # gate into a no-op. `git grep -F` compares bytes, so it holds in any locale.
      #
      # vendor/ is excluded: it is third-party source (a released i18n-embed-fl with one
      # backported fix), so its punctuation is not ours to rewrite. THIRD-PARTY-LICENSES.txt
      # is excluded for the same reason - it is generated (scripts/generate-licenses.sh) and
      # consists entirely of upstream license texts, which must be reproduced verbatim.
      # deploy/bitcoin-core/*.ots is a binary OpenTimestamps proof copied verbatim from the
      # Bitcoin Core release (see the README beside it): arbitrary bytes, so a future
      # version's proof could contain the em-dash byte sequence by coincidence.
      - name: No em-dashes (U+2014)
        run: |
          if git grep -nF -e "$(printf '\xe2\x80\x94')" -- ':!vendor' ':!THIRD-PARTY-LICENSES.txt' ':!deploy/bitcoin-core/*.ots'; then
            echo "::error::Em-dash (U+2014) found at the locations above. House style is ASCII punctuation only: use a spaced hyphen ' - ', a comma, or parentheses."
            exit 1
          fi
