[package]
name = "rosed"
version = "0.10.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "A Bitcoin-Core-style JSON-RPC wallet server: the rose daemon and the library behind it, with a BDK Bitcoin engine and an opt-in Zakura Common (librustzcash) Zcash engine"
repository = "https://github.com/fathom-x/rose"
readme = "README.md"
keywords = ["bitcoin", "zcash", "wallet", "json-rpc", "bip157"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
# What the crate ships: the source, the licenses, and the two files the build embeds with
# `include_str!` (`rose.example.toml` for `rose example-config`, THIRD-PARTY-LICENSES.txt for
# `rose licenses`). Everything else in this tree - deploy samples, scripts, docs, the harness,
# the workflows - is the repository's, not the crate's. The patterns are anchored: an
# unanchored `README.md` is gitignore syntax and matches every README in the tree.
include = [
    "/src/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/THIRD-PARTY-LICENSES.txt",
    "/rose.example.toml",
]

# Two crates over one library: this one is the library plus the `rosed` daemon, and
# `rose-cli/` is the operator's `rose` binary (the admin subcommands and a bitcoin-cli-style
# RPC client). The regtest harness is deliberately *not* a member: it keeps its own
# lockfile, isolated from this crate's pinned wallet stack.
[workspace]
members = ["rose-cli"]
exclude = ["regtest-harness"]

[[bin]]
name = "rosed"
path = "src/main.rs"
# The daemon: the HTTP servers over the embeddable node, with the boot-time flags
# (`--restore-if-empty`) and nothing else - every subcommand is `rose`'s (rose-cli/). Library
# consumers build with `default-features = false` (the embeddable node + the CLI cores, no
# axum/clap).
required-features = ["server", "cli"]

[dependencies]
# Async runtime + HTTP server (hyper's client side drives the zebra JSON-RPC backend).
# axum serves only the HTTP layers (`server::run`, `health::run`), so it is optional behind the
# `server` feature; it is also a dev-dependency (below) because `chain/zebra.rs`'s offline tests
# run a fake zebrad on it under every feature combination.
tokio = { version = "1.21", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["json"], optional = true }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
bytes = { version = "1", optional = true }
futures-util = "0.3"

# Serialization. `arbitrary_precision` is REQUIRED: bitcoind emits amounts as JSON numbers
# with 8 decimals and clients parse them as Decimal; without this they round-trip through f64.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

# CLI / config / logging. clap and tracing-subscriber serve only the CLI surface (the flag
# parsing and the binary's tracing init), so both ride the `cli` feature; the `tracing` facade
# stays unconditional.
clap = { version = "4.5", features = ["derive", "string", "env"], optional = true }
toml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }

# Auth. hmac+sha2 implement Bitcoin Core's salted `rpcauth` scheme (HMAC-SHA256).
#
# base64/hmac/sha2/ripemd are held at the versions the rest of the tree already compiles
# (`age` and `zcash_client_backend` on base64 0.22, the whole librustzcash stack on the
# RustCrypto 0.10/0.12 generation). Newer majors exist - base64 0.23, hmac 0.13, sha2 0.11,
# ripemd 0.2 - but taking them here would compile a second copy of each for rose's own two
# call sites without changing any behaviour, so they stay in lockstep instead.
base64 = "0.22"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
# hash160 (= ripemd160(sha256)) for transparent-script address extraction in
# `getrawtransaction`; already in the tree via the zcash crates.
ripemd = { version = "0.1", optional = true }
# `signmessage`/`verifymessage` sign the double-SHA256 message hash with the transparent
# address's secp256k1 key and recover the signer's pubkey. The `recovery` feature provides the
# recoverable-ECDSA API (compact 65-byte header+sig, as zcashd/zallet produce). Already in the
# tree via the zcash crates; matches zallet's pin.
secp256k1 = { version = "0.29", features = ["recovery"], optional = true }
# rand 0.10 is the generation the Zakura Common stack speaks (`WalletDb`'s RNG parameter and
# the transaction `Builder` take a `rand_core 0.10` RNG), so rose's own RNG use follows it.
# `thread_rng` implies `std`/`std_rng`/`sys_rng`; `rand::rngs::SysRng` (the OS RNG) is what the
# wallet database is opened with.
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
hex = "0.4"

# Seed handling
# age 0.12 (from 0.11) is what retired the tree's last `[patch.crates-io]`: it depends on
# i18n-embed-fl 0.10, which carries the deterministic-argument-order fix that the vendored
# 0.9.4 used to backport for the reproducible Docker builds. It also adds the age v2 hybrid
# recipient types, so hpke/ml-kem/p256/sha3 arrive as non-optional transitive dependencies;
# the x25519 and scrypt formats rose writes are unchanged, so existing `keys.toml` files
# decrypt exactly as before.
age = { version = "0.12", features = ["armor"] }
bip0039 = { version = "0.14", features = ["std", "all-languages"] }
# secrecy 0.8, not 0.10: `SecretVec` crosses into librustzcash's seed APIs, which are on 0.8.
secrecy = "0.8"

# `prost` deserializes the compact-block / treestate / mempool protobuf types that
# `zcash_client_backend::proto` exposes and the zebra backend constructs (and that
# `sync/engine.rs` serializes to the on-disk block cache). `hyper-util`'s legacy client is the
# HTTP/1.1 client behind the zebra JSON-RPC backend.
prost = { version = "0.14", optional = true }
# lightwalletd transport. `tls-ring` makes tonic select the `ring` rustls crypto provider for
# its own ClientConfig (tonic 0.14 does this internally - no CryptoProvider::install_default
# needed); keep it the *only* rustls provider feature, or tonic's auto-selection breaks.
# `tls-native-roots` lets us trust the OS store (and SSL_CERT_FILE), which `tls-webpki-roots`
# alone does not.
tonic = { version = "0.14", features = ["gzip", "tls-ring", "tls-native-roots", "tls-webpki-roots"], optional = true }
# The rustls that tonic already dials with (via tokio-rustls), pulled in directly only for the
# `ServerCertVerifier` impl behind `[backend] tls_insecure_skip_verify`. `default-features =
# false` is load-bearing: rustls' defaults enable `aws_lc_rs` (and `prefer-post-quantum`, which
# implies it), which would land a second crypto provider in the tree and break tonic's
# auto-selection. `ring` matches tonic's `tls-ring`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
# SOCKS5 client for `[backend] proxy`. Deliberately a *transport-only* crate (futures-util,
# thiserror, tokio): it carries no rustls, so it cannot land a second crypto provider and break
# tonic's auto-selection. `tower-service` is the bare `Service` trait - both tonic's
# `connect_with_connector` and hyper-util's legacy-client `Connect` bound are expressed over it,
# so the SOCKS connector needs only this, not all of `tower` (which stays a dev-dependency).
tokio-socks = "0.5"
tower-service = "0.3"
# rusqlite 0.37 is `zcash_client_sqlite`'s own requirement; rose opens connections to the
# same database, so the two must be the same crate version, not merely compatible ones.
# `bundled` compiles SQLite in: the Zcash wallet crate asks for it anyway, and a Bitcoin-only
# static build has no system libsqlite3 to link against.
rusqlite = { version = "0.37", features = ["time", "bundled"] }
time = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

# Zcash. The proving/protocol stack and the wallet layer come from **Zakura Common**
# (https://zakura.com/announcements/zakura-common/ - zakura-core/common and
# zakura-core/wallet-libraries): renamed forks of the librustzcash crates, published on
# crates.io under `zakura-*` names. The dependency *key* keeps the upstream name (via
# `package = "zakura-..."`), so every `use orchard::` / `use zcash_client_backend::` path in the
# sources is unchanged - the switch is a Cargo-level rename, never a source edit.
#
# Two rules keep the graph coherent, both inherited from zakura-core/wallet-libraries:
#
# - The crypto and protocol family (`zakura-orchard`, `zakura-primitives`, `zakura-keys`,
#   `zakura-proofs`, `zakura-sapling-crypto`, `zakura-protocol`, `zakura-address`,
#   `zakura-transparent`, `zakura-zip321`) releases in lockstep and is asked for at one version,
#   `2.2`, matching the wallet layer (`zakura-client-backend`/`zakura-client-sqlite` 0.1.0-rc7,
#   `zakura-pczt` 0.1.0-rc4), which requires `^2.0.0` of each. A *second* copy of any member
#   would be a second, incompatible type family. `2.2` is the floor rather than `2.0` because
#   `zakura-protocol` 2.2.0 is the release that schedules NU7 on testnet; an older 2.x
#   compiles and simply never activates it (`network::tests` pins the height).
# - The crates the forks still take from crates.io (`zcash_encoding`, `zcash_script`, `zip32`,
#   `nonempty`, `incrementalmerkletree`, `shardtree`) stay on crates.io here too, at
#   requirements compatible with the forks', so exactly one copy of each enters the graph.
#   Their types cross the boundary, so a divergent pin would surface as a type error naming two
#   identical-looking paths. (The 1.x family took `zcash_protocol`, `zcash_address`,
#   `zcash_transparent` and `zip321` from crates.io as well; 2.x forks them.)
#
# `scripts/verify-zakura-graph.sh` (the CI `zakura-graph` job) proves the resolved graph carries
# no crates.io original of a forked crate and no duplicate `zakura-*` package.
#
# `circuit` exposes `orchard::circuit::{ProvingKey, VerifyingKey}` so we can build the Orchard
# proving key once at startup and reuse it for every send (the PCZT prove path), instead of
# librustzcash's fused builder which rebuilds it per transaction.
# `orbits` (Zakura-only) enables the fork's prepared fixed-base commitment tables, which
# `ProvingKeyCache::build` arms once per key via `ProvingKey::prepare_proving()` - the prover
# then commits through the prepared tables on bounded-width thread pools. Without the feature
# that call is a no-op returning `false`.
orchard = { package = "zakura-orchard", version = "2.2", default-features = false, features = ["circuit", "orbits"], optional = true }
zcash_address = { package = "zakura-address", version = "2.2", optional = true }
# `CompactSize` builds the length-prefixed preimage for the `signmessage`/`verifymessage`
# message hash (magic + message, each CompactSize-prefixed, double-SHA256), byte-identical to
# zcashd's `rpc/misc.cpp` and zallet. 0.4, matching the rest of the librustzcash stack -
# 0.5 exists but taking it would add a second copy for one call site.
zcash_encoding = { version = "0.4", optional = true }
# `transparent-inputs` lets transparent receivers surface in getrawtransaction/getaddressinfo
# and the received-by-address read paths; rose's own wallets never expose transparent receivers.
# `pczt` exposes `create_pczt_from_proposal` / `extract_and_store_transaction_from_pczt`, the
# build/prove/store seam that lets the proving step take a cached Orchard proving key.
zcash_client_backend = { package = "zakura-client-backend", version = "0.1.0-rc7", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "transparent-inputs", "pczt"], optional = true }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "0.1.0-rc7", features = ["unstable", "orchard", "serde", "transparent-inputs"], optional = true }
zcash_keys = { package = "zakura-keys", version = "2.2", features = ["unstable", "orchard"], optional = true }
zcash_primitives = { package = "zakura-primitives", version = "2.2", optional = true }
zcash_proofs = { package = "zakura-proofs", version = "2.2", features = ["bundled-prover"], optional = true }
zcash_protocol = { package = "zakura-protocol", version = "2.2", features = ["local-consensus"], optional = true }
zcash_transparent = { package = "zakura-transparent", version = "2.2", optional = true }
# Script asm rendering + standard-script solver for `getrawtransaction` (already in the
# tree via zcash_transparent; same crate Zallet uses for this).
zcash_script = { version = "0.4.5", optional = true }
sapling = { package = "zakura-sapling-crypto", version = "2.2", optional = true }
# `NonEmpty` is the shape librustzcash's proposal API speaks (`ShieldedInputs::from_parts`,
# `Proposal` steps); needed by the hand-built z_mergetoaddress proposals. Same version the
# librustzcash workspace pins, so the types unify - which is why this stays at 0.11 rather than
# following the released 0.12.
nonempty = { version = "0.11", optional = true }
# PCZT roles (Prover/Signer) for the cached-proving-key send path. The version tracks the
# `zakura-client-backend` `pczt` feature's own pin.
pczt = { package = "zakura-pczt", version = "0.1.0-rc4", default-features = false, features = ["prover", "signer", "orchard", "sapling"], optional = true }
zip32 = { version = "0.2", optional = true }
zip321 = { package = "zakura-zip321", version = "2.2", optional = true }
libc = "0.2.186"
# Single-instance guard: an advisory exclusive lock on `<datadir>/.lock` so two rose processes
# can't operate on the same data directory at once (mirrors zallet / zcashd). Linux only needs
# libc (already in-tree); windows-sys is pulled in transitively on Windows.
fmutex = "0.3"

# Bitcoin - the BDK wallet engine behind the `bitcoin` feature. One crate: `bdk_wallet`
# re-exports `bitcoin`, `miniscript` and `bdk_chain`, so the whole engine surface arrives
# through this dependency and its types stay confined to `src/btc/` (the engine-boundary rule
# below). Deliberately WITHOUT bdk's `rusqlite` persistence feature: `bdk_chain` pins
# `rusqlite ^0.31`, whose `libsqlite3-sys` conflicts with rose's `rusqlite 0.37` (`links =
# "sqlite3"` - only one version may exist in a build graph), so `src/btc/store.rs` implements
# `WalletPersister` over rose's own rusqlite instead.
bdk_wallet = { version = "3.1", optional = true }
# The `rand_core` generation BDK's `CoinSelectionAlgorithm::coin_select` bounds its RNG on
# (0.6). rose's own RNG use is on `rand` 0.10, whose `RngCore` is a different trait, so the
# ancestor-aware selector names BDK's directly.
rand_core = { version = "0.6", optional = true }
# The BDK engine's bitcoind chain source: a checkpoint-anchored block/mempool emitter over
# Bitcoin Core's JSON-RPC (`bitcoincore-rpc`, blocking - the actor drives it under
# `block_in_place` like the Zcash scan). Shares `bdk_core`/`bitcoin` with `bdk_wallet` 3.x,
# so its checkpoints and block events apply to the wallet directly. Keep the version paired
# with `bdk_wallet`'s line when bumping either.
bdk_bitcoind_rpc = { version = "0.22", optional = true }
# The BDK engine's second chain source: Kyoto, a BIP-157/158 compact-block-filter light
# client that peers over the Bitcoin P2P layer with no server and no credentials. Async and
# event-driven (the node runs as its own task and emits `Update`s), unlike the blocking
# bitcoind emitter - the actor dispatches between the two shapes. Tracks `bdk_wallet 3.x`
# (`bdk_kyoto ^0.17` depends on `bdk_wallet ^3`), so keep the three lines paired when bumping.
bdk_kyoto = { version = "0.17", optional = true }
# HTTPS for the BDK engine's mempool.space fee oracle (`src/btc/fees.rs`). Composes the
# existing hyper 1 + rustls 0.23 stack into a TLS connector; `webpki-tokio` uses the compiled-in
# Mozilla root set rather than reading the host trust store, so the fee lookup behaves the same
# in a scratch container as on a developer box.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"], optional = true }
# WebSocket client for the BDK engine's opt-in kyoto mempool feed (`src/btc/mempool_feed.rs`,
# the mempool.space `track-mempool` stream). `rustls-tls-webpki-roots` rides the same rustls
# 0.23 + tokio-rustls + compiled-in Mozilla roots the rest of the tree already carries; the
# crate enables no rustls crypto-provider feature of its own, so `ring` stays the only one
# (see the `tls-ring` note above). `handshake` is what the offline tests' in-process fake
# feed server needs (`accept_async`). 0.28 is the last line on `sha1 0.10`; 0.29+ wants
# `digest 0.11`, which the pinned librustzcash pre-release `bip32` cannot share.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }

# Optional drop-in allocator, enabled by both musl release images (`Dockerfile` and
# `Dockerfile.arm64`). musl's default `malloc-ng` contends under Orchard proving's multi-threaded
# (rayon) allocation churn - ~80x more futex syscalls than mimalloc - costing ~10% per shielded
# send on bare metal and several× in syscall-expensive sandboxes (gVisor/nested-virt/some CI);
# mimalloc restores parity in both. Native glibc builds (dev, tests) leave it off - glibc's own
# allocator already scales, so the dependency is pure overhead there.
mimalloc = { version = "0.1", optional = true }

[features]
# The daemon's full surface, on by default so `cargo build`/`cargo test` produce the shape a
# Bitcoin deployment ships: the HTTP transports, the CLI cores, and the Bitcoin wallet engine.
# The Zcash engine is opt-in (`--features zcash`); the release images carry both. A library
# consumer builds with `default-features = false` plus the engine(s) it wants for the
# embeddable node (`crate::node`) and the CLI cores, without axum or clap in the tree.
default = ["server", "cli", "bitcoin"]
# The HTTP transports: the axum JSON-RPC server (`server::run`) and the health server.
server = ["dep:axum"]
# The clap CLI surface (`config::Cli`, the subcommand shells) and `daemon::init_tracing`.
cli = ["dep:clap", "dep:tracing-subscriber"]
# A coin is an engine, and an engine is a feature. At least one of `zcash`/`bitcoin` must be
# on (`lib.rs` refuses to build otherwise); a build carrying one engine refuses the other's
# `coin` at config resolve ("unsupported coin ... (this build supports: ...)", derived from
# `coin::Coin::SUPPORTED`) and the other's config sections as unknown fields. Both gates stay
# cheap only while the engine-boundary rule holds: no engine crate type in a shared
# signature, config struct, or cross-coin enum - each engine joins the shared shell at the two
# sanctioned seams (`wallet::CoinWallet` and the RPC handlers), everything else lives under
# its own directory (`wallet/`+`sync/`+`chain/` for Zcash, `src/btc/` for Bitcoin). The
# tonic/lightwalletd transport used to be the cautionary precedent for that rule (its types
# had reached `BackendConfig`, so it could not be gated); it now rides the `zcash` gate, and
# the TLS value types it left on the shared config (`backend::TlsRoots`, `CertFingerprint`,
# `TlsOptions`) are rose-owned and stay in the ungated half of `backend.rs`.
#
# The librustzcash-backed Zcash wallet engine: `wallet/`, `sync/`, `chain/` (zebra JSON-RPC and
# lightwalletd gRPC upstreams), `fleet`, the `z_*` RPCs, `node::Node::send`. Opt-in: the
# default build is bitcoin-only and carries no Zcash crate at all - the `features` CI job
# asserts that with `cargo tree`.
zcash = [
    "dep:orchard",
    "dep:sapling",
    "dep:pczt",
    "dep:nonempty",
    "dep:zcash_proofs",
    "dep:zcash_client_sqlite",
    "dep:zcash_client_backend",
    "dep:zcash_primitives",
    "dep:zcash_keys",
    "dep:zcash_address",
    "dep:zcash_protocol",
    "dep:zcash_transparent",
    "dep:zcash_script",
    "dep:zcash_encoding",
    "dep:zip32",
    "dep:zip321",
    "dep:ripemd",
    "dep:bytes",
    "dep:secp256k1",
    "dep:tonic",
    "dep:prost",
    "dep:rustls",
]
# The BDK-backed Bitcoin wallet engine (`src/btc/`), on by default: the default build is the
# bitcoin-only rose, and `coin = "zcash"` in a config is refused there at resolve ("this
# build supports: bitcoin"). `--features zcash` adds the other engine.
bitcoin = ["dep:bdk_wallet", "dep:bdk_bitcoind_rpc", "dep:bdk_kyoto", "dep:rand_core", "dep:hyper-rustls", "dep:tokio-tungstenite"]
# Use mimalloc as the global allocator. Off by default; the musl release images opt in.
mimalloc = ["dep:mimalloc"]
# Hardened mimalloc (MI_SECURE): guard pages, encrypted/canary free-lists, randomized
# allocation. The shipped musl images build with this - it costs <4% on the proving path
# (compute-bound, so allocator hardening barely registers) while restoring the heap-exploitation
# mitigations that swapping out musl's `malloc-ng` would otherwise drop. `mimalloc` (non-secure)
# remains available for anyone who wants the last few percent. See FINDINGS.md.
mimalloc-secure = ["mimalloc", "mimalloc/secure"]
# NB: Ironwood (NU6.3 / V6) is **no longer a cargo feature** - it is compiled unconditionally (the
# published ironwood librustzcash line exposes the ironwood APIs unconditionally).
# Activation is purely consensus-height driven via `is_nu_active(NetworkUpgrade::Nu6_3, ...)`: LIVE
# on mainnet at height 3_428_143 and on testnet at 4_134_000 (both carried by `zcash_protocol`), and
# opt-in on regtest via the `ROSE_REGTEST_NU63_HEIGHT` env var, which CI sets to 8 for the whole
# regtest tier - so every regtest flow runs NU6.3-active, matching the public networks (the one
# deliberate exception is `tests/embedded_regtest.rs`, whose chain stays pre-NU6.3). So ironwood
# is "always built, live on both public networks" with no build flag - a mainnet send past
# 3_428_143 is an ironwood send. NU7 follows the same model: compiled unconditionally (the 2.x
# family dropped upstream's `zcash_unstable = "nu7"` cfg gate), activated by height - testnet
# 4_465_026, mainnet unscheduled - and opt-in on regtest via `ROSE_REGTEST_NU7_HEIGHT`, which
# the regtest tier leaves unset. Every dependency here is a crates.io release and there are no
# git pins or `[patch.crates-io]` entries, but not every one is a *stable* release: the Zakura
# wallet layer (`zakura-client-backend`/`zakura-client-sqlite` 0.1.0-rc7, `zakura-pczt`
# 0.1.0-rc4) is still on release candidates, and the crypto family moves with it, on a
# wallet-layer release.

[dev-dependencies]
socket2 = "0.6"   # tests: read SO_RCVBUF back on the bounded P2P sockets (btc/net.rs)
tempfile = "3"
# Frontier bookkeeping for the fabricated-chain reorg test (matches librustzcash's version).
incrementalmerkletree = "0.8"
# The fake in-process zebrad in `chain/zebra.rs`'s tests is an axum server, and the HTTP
# integration tests drive `server::router` with `tower::ServiceExt::oneshot`. Dev-dependencies
# so both compile under every feature combination (axum is otherwise `server`-only, and tower
# is test-only).
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5", features = ["util"] }

# Dependency notes.
#
# The Zakura Common forks above are forks of the ironwood / NU6.3 librustzcash line - the leaf
# crates (`zcash_primitives`/`zcash_proofs 0.30`, `orchard 0.15`, `zcash_keys 0.16`) and the
# wallet crates (`zcash_client_backend 0.24.0`, `zcash_client_sqlite 0.22.0`, `pczt 0.9.3`, all
# forked at their `-rc.7`/0.15.5 trees), while `zcash_protocol 0.10`, `zcash_address 0.13.0`,
# `zcash_transparent 0.10.0` and `zip321 0.9.0` are the upstream releases themselves. Before the
# forks that line was consumed straight from crates.io as stable releases (the wallet crates
# rode release candidates until upstream published the finals on 2026-08-18), which in turn
# replaced the previous all-or-nothing `[patch.crates-io]` git pin of the whole librustzcash
# workspace to the `dw/ironwood-scan-model` rev `1105d8203` (zcash/librustzcash#2539), which
# existed only because the wallet crates had no ironwood release yet. The
# shardtree/incrementalmerkletree git pins went with it: this line depends on published
# `shardtree 0.7` / `incrementalmerkletree 0.8.2`, which carry the explicit-checkpoint-retention
# APIs and the `clear_flags` checkpoint-pruning panic fix the old pins existed for. Rose carries
# **no fork of its own, no git pins, and no prerelease requirements beyond the `zakura-*`
# wallet layer's own `-rc` version numbers**.
#
# Still-relevant notes inherited from the git-pin era (they describe the forked line too):
#
# - **Self-send memo backfill is NOT in this line.** A cherry-pick (submitted upstream separately)
#   filled a received note's NULL memo for the wallet's *own* mined self-sends via a `put_blocks`
#   re-decryption pass. The gap is narrow and self-healing (the live mempool path fills the memo on
#   the authoring node; a from-seed restore recovers it via enhancement) - it only bites the
#   authoring node when the mempool missed its own self-send, and a rescan fixes it. Re-check when
#   bumping to the next release.
# - **Ironwood sends route through the cached-key PCZT path.** The published line BUILDS Ironwood
#   PCZTs (librustzcash#2543 landed - the old git rev rejected them), so the `ironwood_forces_fused`
#   gate in `actor.rs` is gone and post-NU6.3 sends no longer pay the fused path's ~4.5 s/send
#   keygen. `ProvingKeyCache` caches both circuit keys (`FixedPostNu6_2` for the V2 Orchard bundle,
#   `PostNu6_3` for the V3 Ironwood bundle); see the send-proving-path notes in the project docs.
# - **The extractor records Ironwood outputs** (since `zcash_client_backend 0.24.0-rc.7`). Through
#   rc.6, `extract_and_store_transaction_from_pczt` built its `SentTransaction` outputs from the
#   Sapling and Orchard bundles only, so a post-NU6.3 send's Ironwood payment/change outputs reached
#   the DB with no `sent_notes` row and no memo; it now records them (and tags every shielded sent
#   output with its note commitment tree). `actor::backfill_ironwood_memos` - the workaround that
#   re-decrypted the just-stored transaction - is gone. If a future bump ever regresses the
#   extractor, the symptom is a missing memo on an ironwood send's own outputs on the authoring
#   node, and only the regtest ironwood tier can see it.
# - **Pool migration is most of what the 0.22.0 sqlite line added, and rose does not use it.** The
#   migration history/cancel/finalize APIs, a `MigrationUuid` identity, two migration views, and
#   schema migrations reworking those tables (txid to BLOB, uuid + committed_height columns) - all
#   over tables rose never writes, so they run empty. Two changes do touch paths rose is on.
#   `WalletWrite::store_transactions_to_be_sent` - the fully-transparent t-to-t send path's store
#   call - upserts each transaction's sent-output records rather than failing on a transaction the
#   wallet already recorded, and classifies each stored transaction against ZIP 318 at store time
#   instead of waiting for it to mine; both are strictly more forgiving.
# - **What the finals added over the last RCs**, none of it requiring a rose source change.
#   `Proposal::check_transaction_size` estimates a step's serialized size from its inputs, outputs
#   and change and rejects a proposal that could not fit in a block (`MAX_BLOCK_BYTES`), as a new
#   `ProposalError` variant; every `propose_*` call and every build entry point
#   (`create_proposed_transactions`, `create_pczt_from_proposal`) runs it, so an over-large
#   selection now fails at proposal time with a specific error instead of at build time - which
#   matters most to the callers that deliberately select as many inputs as they can,
#   `z_shieldcoinbase` and an `ANY_TADDR` shield. The size constants behind the estimate are what
#   `zcash_primitives 0.30.1` publishes.
#   A new `standalone_address` schema migration relaxes the `addresses` constraint to admit
#   upstream's new bare-address import (`transparent-key-import`, which rose does not enable);
#   it rebuilds the `addresses` table, so an existing wallet database is migrated in place.
#   Transparent P2SH inputs whose size the wallet has not been told now estimate as
#   `InputSize::Unknown` (the consensus maximum) rather than being guessed at P2PKH size; rose
#   spends only P2PKH, so this is inert here.
# - **`orchard` 0.15.4 speeds up batched trial decryption**, which is how the compact-block scan
#   decrypts every block's outputs: GLV endomorphism setup is now shared across a whole batch
#   instead of recomputed per output. Shared secrets are byte-identical to the per-item path, so it
#   changes throughput only, never what the scan finds. 0.15.5 is a version-requirement bump only
#   (minimum `halo2_proofs` 0.3.5).
# - **Single-pool-group input selection** (upstream `00c789f9`): shielded inputs come from one of
#   two mutually-exclusive groups - {Orchard} or {Sapling+Ironwood}, never mixed - the NU6.3
#   migration model (past NU6.3 a new Orchard-address output becomes an ironwood V3 note, so Orchard
#   V2 is a legacy drain-only pool). Applied *unconditionally* (pre-NU6.3 too), so the default
#   (NU6.2) build no longer combines Sapling+Orchard inputs in one transaction; the `regtest_sapling`
#   e2e was updated to the turnstile model to match.
# - **Ironwood model** (matches devtool): ironwood notes are **Orchard V3 notes** - same key tree,
#   same key derivation, scanned by the existing Orchard path, stored in `ironwood_received_notes`
#   and surfaced in `v_received_outputs` with pool code 4; balances roll up via
#   `AccountBalance::ironwood_balance()`. **Sends**: the proposal auto-routes Orchard payment/change
#   into the ironwood bundle past NU6.3, and the prover adds an ironwood proof step
#   (`requires_ironwood_proof`/`create_ironwood_proof`) using a `PostNu6_3` proving key (see
#   `actor.rs`; mirrors devtool's `pczt/prove.rs`).
#
# There are **no `[patch.crates-io]` entries**. The tree carried one until `age 0.12`: a vendored
# `i18n-embed-fl` 0.9.4 with the deterministic-argument-order fix from kellpossible/cargo-i18n#151
# backported, without which `age`'s `fl!` macro expansions (and therefore the reproducible Docker
# builds) were a per-build coin flip. `age` 0.12 depends on `i18n-embed-fl` 0.10, which carries
# that fix upstream, so the vendored copy and the patch entry are gone.
