# The attestation checker (src/main.rs), on its own so anyone builds it with plain cargo:
#
#   cargo build --release --manifest-path contrib/holder-tools/attestation-check/Cargo.toml
#
# The released binary is the same main.rs built inside Locksmith's crate in its StageX image
# (../build.sh). bootproof-sdk is pinned to the commit Locksmith pins, so both builds verify
# with the same code; nothing here needs Distrust's private registry. Not a workspace
# member: the product's builds and CI do not see it.
[package]
name = "attestation-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bootproof-sdk = { git = "https://codeberg.org/caution/bootproof.git", rev = "b03721957e3850931f5b53627e7c3d1c302a06fe" }
serde_cbor = "0.11.2"
serde_json = "1"
smex = "0.2.1"

[profile.release]
strip = true
