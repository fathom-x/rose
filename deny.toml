[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0374: `basic-toml` is unmaintained (its repository was archived in
# 2025-03; informational, no vulnerability). It reaches the tree only through `age` ->
# `i18n-embed-fl` -> `i18n-config`, where it parses the i18n configuration of age's own
# localized messages at compile time (the `fl!` proc macro), so no untrusted input ever
# meets it. Every crate on that chain is at its newest release and i18n-config 0.4.8 still
# requires it, so there is nothing to upgrade to; drop the exception when i18n-config moves
# to `toml`. (The previous exception, RUSTSEC-2026-0173 - proc-macro-error2 unmaintained -
# went away when `age` 0.12 moved to i18n-embed-fl 0.10, which depends on the maintained
# proc-macro-error3 fork, and getset 0.1.7, orchard's build-time dependency, dropped it too.)
ignore = [{ id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained: compile-time i18n config parser behind age, no upgrade exists yet" }]

[licenses]
version = 2
# rose is MIT OR Apache-2.0; permit the usual permissive set for
# transitive deps. Tighten as needed if `cargo deny` complains.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # webpki-roots: Mozilla CA root certificate bundle.
    "CDLA-Permissive-2.0",
    # hex_lit (via the rust-bitcoin stack behind the off-by-default `bitcoin` feature):
    # MIT +no-false-attribs, a permissive MIT variant whose one extra clause forbids
    # misrepresenting the software's origin.
    "MITNFA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources: the whole librustzcash/ironwood set (including shardtree +
# incrementalmerkletree) now resolves from crates.io, so there is no `allow-git`
# exception to carry. Re-add one only if a dependency ever needs a git pin again.
