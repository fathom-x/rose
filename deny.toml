[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0374: `basic-toml` is unmaintained (its repository was archived in
# 2025-03; informational, no vulnerability). It reaches the tree only through `age` ->
# `i18n-embed-fl` -> `i18n-config`, where it parses the i18n configuration of age's own
# localized messages at compile time (the `fl!` proc macro), so no untrusted input ever
# meets it. Every crate on that chain is at its newest release and i18n-config 0.4.8 still
# requires it, so there is nothing to upgrade to; drop the exception when i18n-config moves
# to `toml`. (The previous exception, RUSTSEC-2026-0173 - proc-macro-error2 unmaintained -
# went away when `age` 0.12 moved to i18n-embed-fl 0.10, which depends on the maintained
# proc-macro-error3 fork, and getset 0.1.7, orchard's build-time dependency, dropped it too.)
# RUSTSEC-2026-0387: `crypto-bigint` 0.5.5 has secret-dependent branches in operations meant
# to be constant-time; only 0.7.6 is fixed. It reaches the tree only through `age` -> `p256`
# (`elliptic-curve` 0.13 pins crypto-bigint 0.5), which age uses for its P-256 tag
# recipients. rose encrypts and decrypts with X25519 and scrypt stanzas only, so no secret
# ever meets P-256 arithmetic. age 0.12.1 is its newest release; drop the exception when age
# moves to p256 0.14.
# RUSTSEC-2026-0459 (CVE-2026-119375): bundled SQLite before 3.54.0 reads a `-wal` frame at the
# WAL header's page size without checking it against the database's, so a crafted database plus
# `-wal` pair leaves the tail of a page buffer uninitialized and queries return stale process
# memory. The only trigger is opening a database file pair that a less trusted party wrote.
# rose never does: every connection (`wallet/open.rs`, `wallet/read.rs`, `btc/store.rs`) opens a
# path it derives itself under its own datadir (`config::engine_dir`/`shard_engine_dir` +
# `data_db_path`/`wallet_db_path`); no RPC, CLI flag or config key names a database file
# (`loadwallet`/`createwallet` read and write fleet TOML manifests, the shard databases are
# rose's own), and `rose-petal` links no SQLite. A party that can write that datadir can already
# replace the wallet database and sits beside `keys.toml` and `identity.txt`, so the bug adds no
# capability there; in the enclave the datadir is created empty at every boot inside the
# enclave, where nothing outside can write. The fix (libsqlite3-sys 0.39, rusqlite 0.41) cannot
# resolve yet: `links = "sqlite3"` allows one copy, and every zakura-client-sqlite release
# requires rusqlite ^0.37. Drop the exception with that bump.
# RUSTSEC-2023-0071: `rsa` 0.9 (the Marvin attack) leaks private-key bits through the timing of
# many RSA decryptions or PKCS#1 v1.5 signatures an attacker can trigger and measure. It reaches
# the tree only through `rose-petal` -> `pgp` (`default-features = false` does not drop it), so
# it ships in the shard holder's binary alone: `rosed`, `rose` and the images do not link `pgp`.
# `rose-petal` makes private-key operations only on the holder's own machine, once per shard
# send, with the holder's keyring, so there is no oracle a remote party can query repeatedly,
# and only an RSA holder key would be exposed. `rsa` 0.10 is fixed, but `pgp` 0.21.1, its newest
# release, still requires `rsa ^0.9.10`; drop the exception when `pgp` moves, then cut a new
# holder-tools release.
# RUSTSEC-2021-0127: `serde_cbor` is unmaintained (informational). It is a dev-dependency of
# `rose-petal` only (its test fixtures' hashing), and no shipped binary links it.
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained: compile-time i18n config parser behind age, no upgrade exists yet" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing leaks: reached only via age's P-256 recipients, which rose never uses; no age release on a fixed version yet" },
    { id = "RUSTSEC-2026-0459", reason = "SQLite WAL page-size disclosure: needs a crafted db + -wal pair, and rose opens only files it creates in its own datadir; fix blocked on zakura-client-sqlite" },
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack: only in rose-petal via pgp, holder-local private-key operations with no remote timing oracle; no pgp release on rsa 0.10 yet" },
    { id = "RUSTSEC-2021-0127", reason = "serde_cbor unmaintained: a rose-petal dev-dependency only, never shipped" },
]

[licenses]
version = 2
# rose is MIT OR Apache-2.0; permit the usual permissive set for
# transitive deps. Tighten as needed if `cargo deny` complains.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # webpki-roots: Mozilla CA root certificate bundle.
    "CDLA-Permissive-2.0",
    # hex_lit (via the rust-bitcoin stack behind the off-by-default `bitcoin` feature):
    # MIT +no-false-attribs, a permissive MIT variant whose one extra clause forbids
    # misrepresenting the software's origin.
    "MITNFA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources: the whole librustzcash/ironwood set (including shardtree +
# incrementalmerkletree) now resolves from crates.io, so there is no `allow-git`
# exception to carry. Re-add one only if a dependency ever needs a git pin again.
