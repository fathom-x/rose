# Production Bitcoin Core **mainnet** node + web UI for rose's BDK engine (the `bitcoin`
# cargo feature), pinned to the same 30.2 the regtest/testnet stacks and CI run against.
#
# This is NOT a copy of the docker-compose.btc-{regtest,testnet3,testnet4}.yml shape -
# those are dev nodes (fixed btc/btc creds, -rpcallowip=0.0.0.0/0) safe only because they
# publish on loopback with valueless coins. This file is hardened for a real-money,
# internet-facing host, with the UI kept loopback-only by default:
#   - RPC auth is bitcoind's own cookie (written to the datadir, root-readable on this
#     host; no static credential exists to leak or rotate). rose talks to this node over
#     kyoto light mode, which is credential-free P2P, so nothing needs an RPC password.
#   - RPC is published on 127.0.0.1 ONLY, so it is not reachable from the internet, and
#     -rpcallowip is scoped to this compose network's subnet, not 0.0.0.0/0.
#
# ADOPTS THE EXISTING SYNCED DATADIR at /mnt/data/bitcoin_data (do not resync). That data
# was synced by the now-retired `txmonitor`/blocktower stack (compose at
# /home/ubuntu/txmonitor/); blocktower has moved to another machine, so nothing here
# consumes the node anymore except rose. Consequently, versus the old node:
#   - ZMQ (28332/28333/28334) is DROPPED - it only fed blocktower, and rose's full-mode
#     backend polls JSON-RPC (bdk_bitcoind_rpc), it does not use ZMQ. One less exposure.
#   - P2P 8333 IS published (see the ports block): this node serves compact block filters
#     to rose's kyoto light mode, which speaks P2P and needs to reach it. That also means
#     accepting inbound Bitcoin peers generally.
#
# Flags below match the retired node so adopting its datadir does NOT trigger a reindex:
#   - -txindex=1        (getindexinfo: txindex present + synced)
#   - full node         (getblockchaininfo: pruned=false)
#   - blockfilterindex/peerblockfilters ARE enabled (the old node had neither), for kyoto.
#     Turning them on was a one-time full-chain index build; it does not affect txindex or
#     the chainstate, so it is not a resync and is reversible by dropping the two flags.
#
# ONE-WAY NOTE: the first start of 30.2 against this datadir upgrades the chainstate; it
# can no longer be opened by 24.x afterward. 30.2 is the intended target, so this is fine -
# just be aware a rollback would mean a resync.

# Pointing rose at this node, in either of its two modes:
#
#   FULL MODE (JSON-RPC, this host only) - sees the mempool, so 0-conf receives and
#   estimatesmartfee work; authenticates with the node's cookie file (root-readable, so
#   rose must run as root or the cookie's group).
#     [bitcoind]
#     server = "bitcoind"          # -> 127.0.0.1:8332
#     rpc_cookie = "/mnt/data/bitcoin_data/.cookie"
#     [wallets.btc]
#     coin = "bitcoin"
#
#   LIGHT MODE (kyoto, BIP-157/158 over P2P) - no credentials at all, from this host or any
#   other. No mempool (a payment appears when it confirms) and no estimatesmartfee.
#     [wallets.btc]
#     coin = "bitcoin"
#     server = "kyoto://127.0.0.1:8333"      # this host
#     server = "kyoto://216.230.225.43:8333,216.230.225.42:8333"   # from elsewhere: the
#                                             # replicas' public ips, as a failover set
#     server = "kyoto"                        # or don't use this node at all: the network's
#                                             # DNS seeds find public filter-serving peers
#   Prefer the trusted-peer forms: naming a peer makes the light client whitelist-only, so
#   its fee signals (the BIP-133 feefilter, the tip-block fee average) and block data all
#   come from this node rather than from anonymous peers a dishonest one could hide among.
#   `rose init` on a kyoto wallet is offline (it will not start a P2P node to read the tip):
#   a fresh wallet's birthday defaults to today's date, resolved against the shipped scan
#   floor, and the first sync refines it to a real (height, hash) from kyoto's own headers.
#   Pass --birthday <height|YYYY-MM-DD> only to start EARLIER, i.e. restoring a seed with
#   history.
#
services:
  bitcoind:
    image: bitcoin/bitcoin:30.2
    restart: unless-stopped
    # Run as root: the retired node ran bitcoind as root, so the datadir contents are
    # root-owned. Matching that avoids chown-ing 871 GB. (Optional later: stop the node,
    # `chown -R 1000:1000 /mnt/data/bitcoin_data`, switch to `user: "1000:1000"`.)
    user: "0:0"
    # Bypass the image's docker-entrypoint.sh: it injects its own -datadir
    # (/home/bitcoin/.bitcoin) and drops to the bitcoin user, which would ignore our datadir
    # and can't access this root-owned one. Run bitcoind directly as root instead.
    entrypoint: ["bitcoind"]
    stop_grace_period: 300s   # let bitcoind flush chainstate on SIGTERM; a short grace = reindex
    command:
      - -printtoconsole
      - -server=1
      - -txindex=1
      # RPC: listen on the container interface, allow only this compose subnet. With no
      # -rpcauth/-rpcpassword flag, bitcoind auths by its own cookie file (written to the
      # datadir at /mnt/data/bitcoin_data/.cookie, rotated each start, root-readable) -
      # nothing static to provision, leak, or mangle through compose's `$` interpolation.
      # rose itself talks to this node over credential-free kyoto P2P (see LIGHT MODE
      # above); the RPC port exists for host admin (bitcoin-cli) and optional full mode.
      - -rpcbind=0.0.0.0:8332
      - -rpcallowip=172.28.0.0/24
      # Compact block filters (BIP158/157), so this node can serve rose's kyoto LIGHT mode
      # (`server = "kyoto://<this host>:8333"`) as well as its own full-mode RPC wallet.
      # blockfilterindex builds once over the full chain (~1-3 h on this NVMe array, a few
      # GB); getindexinfo reports blockfilter synced:false until it finishes, and the node
      # stays fully usable meanwhile - it just cannot answer filter requests yet.
      # peerblockfilters is what actually serves them to P2P light clients, and needs the
      # index; the two only make sense together.
      - -blockfilterindex=1
      - -peerblockfilters=1
      # Accept inbound P2P. Implicit in Core's defaults, stated here because publishing 8333
      # below only matters if the node is listening.
      - -listen=1
      # Inbound headroom and protection for the host's own clients: the default 125-connection
      # ceiling fills with random inbound peers, after which every new inbound (the paced relay
      # in front of this port, which the enclave wallet dials) gets a handshake and is dropped.
      # Host-originated connections arrive from the compose network's gateway (172.28.0.1 for
      # the network below); BTC_WHITELIST_SUBNET in deploy/.env overrides the subnet when a
      # host's compose network differs, BTC_MAXCONNECTIONS the ceiling.
      - -maxconnections=${BTC_MAXCONNECTIONS:-200}
      - -whitelist=noban@${BTC_WHITELIST_SUBNET:-172.28.0.0/24}
      # Persistent peers: the project's own mainnet replicas (this file, deployed on the
      # 216.230.225.43 and 216.230.225.42 hosts). Running this compose elsewhere (a laptop)
      # keeps those nodes wired in alongside the ~10 auto-managed outbound slots, so blocks
      # and filters come from peers we run. -addnode reconnects on drop. On a replica host
      # itself one entry dials its own published port; Core spots the self-connection by
      # nonce and drops it, so it is harmless there, just a log line.
      - -addnode=216.230.225.43:8333
      - -addnode=216.230.225.42:8333
    networks:
      btcmain:
    ports:
      # RPC stays loopback only: it is plaintext HTTP Basic and spend-adjacent. Host
      # processes (rose in full mode) reach it at 127.0.0.1:8332; the internet cannot.
      - "127.0.0.1:8332:8332"
      # P2P, published to the internet so remote rose kyoto clients can reach this node.
      #
      # This is a deliberate exposure change, and unlike the RPC port it authenticates
      # nothing - that is fine (the P2P protocol has no credentials and reveals no wallet
      # data) but it has two consequences worth knowing. The node now accepts inbound
      # Bitcoin peers generally, not only your own light clients; and -peerblockfilters lets
      # any of them request filters, which is cheap for them and less cheap for us, the
      # bandwidth-amplification tradeoff Core makes the flag opt-in for.
      #
      # To serve only light clients you control instead, drop this to "127.0.0.1:8333:8333"
      # and reach it over WireGuard/SSH from elsewhere, or put the node behind a Tor hidden
      # service (kyoto can dial through a SOCKS5 proxy).
      - "8333:8333"
    volumes:
      # Mount at /root/.bitcoin - root's default datadir (matches how the retired container
      # ran), so no -datadir flag is needed and the existing chainstate is opened directly.
      - /mnt/data/bitcoin_data:/root/.bitcoin

  rose-gui:
    # The wallet dashboard (scripts/rose-gui), proxying to the rose that runs ON THE HOST
    # from deploy/rose.btc-mainnet.toml (no published image carries the bitcoin engine).
    #
    # Host network, deliberately. That config binds rose's RPC - the spend credential's
    # surface - to 127.0.0.1, and on the host network the container reaches it at exactly
    # that address, read from the mounted config. So unlike the testnet stacks there is no
    # --rpc-url, no host.docker.internal, and no `--rpcbind` past loopback on the daemon:
    # spend authority never leaves 127.0.0.1. The UI itself binds 127.0.0.1:8081 on the
    # host (no `ports:` - there is nothing to publish on the host network); put a reverse
    # proxy with TLS and auth in front for remote access. Linux only (host networking),
    # which this node's host is.
    #
    # The UI does not talk to bitcoind, so it neither depends on it nor joins its network.
    # Liveness is the image's own HEALTHCHECK (see scripts/rose-gui/Dockerfile, urllib-based -
    # the image has no curl, so a compose-level curl healthcheck would only ever report
    # unhealthy). The published image (ghcr.io/<repo>-gui) carries the same healthcheck; to
    # pull it instead of building, replace this `build:` block with `image: ghcr.io/<repo>-gui:<ver>`.
    build:
      context: ../scripts/rose-gui
    container_name: rose-gui-mainnet
    restart: unless-stopped
    network_mode: host
    environment:
      # The host rose's RPC password, from deploy/.env (see deploy/.env.mainnet.example).
      # Required: an unset value fails `up` rather than starting a proxy that can only 401.
      - ROSE_RPC_PASSWORD=${ROSE_RPC_PASSWORD:?set ROSE_RPC_PASSWORD in deploy/.env}
    volumes:
      - ./rose.btc-mainnet.toml:/config/rose.btc-mainnet.toml:ro
      # The source, over the image's copy of it, so an edit is live without a rebuild:
      # index.html on the next page load, serve.py via --reload below (the container's
      # PID 1 re-execs itself). The image still carries a copy, so dropping this line and
      # the flag gives the shipped build - do that for a deployment that must not track
      # the checkout.
      - ../scripts/rose-gui:/app:ro
    command:
      - --conf=/config/rose.btc-mainnet.toml
      - --reload
      - --bind=127.0.0.1
      # 8081, not 8080: the testnet4 stack's GUI publishes 127.0.0.1:8080 on the same
      # host, and on the host network there is no port mapping to separate the two.
      - --port=8081
      # Point this at a WATCH-ONLY wallet (init --xpub from the spender's export-xpub) to
      # run the dashboard on a box with no seed; the page detects it and disables sending.

networks:
  btcmain:
    ipam:
      config:
        - subnet: 172.28.0.0/24
