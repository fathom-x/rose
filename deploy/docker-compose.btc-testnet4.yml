# Development-only Bitcoin Core **testnet4** node, for testing rose's BDK engine (the
# off-by-default `bitcoin` cargo feature) with real - valueless - testnet4 coins.
#
# The public-testnet sibling of docker-compose.btc-regtest.yml (same image pin, same
# credential shape; see docker-compose.btc-testnet3.yml for the other public testnet).
# Not part of the self-hosted deployment example (docker-compose.yml) and not used by the
# regtest harness. Unlike regtest there is nothing to mine: the node syncs the public
# testnet4 chain (BIP 94; small - a few GB - so the initial sync is quick) and you fund
# the wallet from a testnet4 faucet (e.g. mempool.space/testnet4).
#
# The node serves:
#   - JSON-RPC on 48332 (bitcoind's testnet4 default - exactly where a testnet4 rose's
#     bare `server = "bitcoind"` token resolves to)
#   - compact block filters over P2P on 48333 (-blockfilterindex + -peerblockfilters,
#     what rose's kyoto/BIP-157 light mode peers with: server = "kyoto://127.0.0.1:48333")
#   - -txindex, so getrawtransaction answers for any confirmed tx
#
# The image is pinned to Bitcoin Core 30.2, in lockstep with the regtest stack and the CI
# `btc-e2e` job (provenance: deploy/bitcoin-core/README.md). Keep the pins together when
# bumping.
#
# Usage:
#   docker compose -f deploy/docker-compose.btc-testnet4.yml up -d
#   alias bcli4='docker compose -f deploy/docker-compose.btc-testnet4.yml exec bitcoind \
#       bitcoin-cli -testnet4 -rpcuser=btc -rpcpassword=btc'
#   bcli4 getblockchaininfo     # wait for initialblockdownload: false
#
# The stack runs the NODE plus the dev web UI (scripts/rose-gui). rose itself is NOT a service
# here: the published image is built without the `bitcoin` cargo feature, so it refuses
# `coin = "bitcoin"` outright. Run rose on the host from a `--features bitcoin` build, and see
# the rose-gui service below for how the containerised UI reaches it.
#
# deploy/rose.btc-testnet4.toml is that rose's config, written out and commented (host-side,
# not mounted here); in outline:
#   network = "test"
#   btc_testnet = "testnet4"
#   [wallets.btc]
#   coin = "bitcoin"            # server defaults to "bitcoind" = 127.0.0.1:48332
#   [bitcoind]
#   rpc_user = "btc"
#   rpc_password = "btc"
#
# rose keeps its own keys (keys.toml) and does all wallet tracking itself - the node
# needs no bitcoind wallet. Credentials are fixed dev values: testnet coins are valueless
# and the RPC port is published on loopback only. Do not reuse this file's shape for
# mainnet.
#
# The `name:` below is load-bearing - see the note in docker-compose.btc-regtest.yml: it
# keeps this node in its own Compose project so `up -d` on the regtest/testnet3 stacks
# cannot replace this one's `bitcoind` container.

name: rose-btc-testnet4

services:
  bitcoind:
    image: bitcoin/bitcoin:30.2
    restart: unless-stopped
    command:
      - -testnet4
      - -printtoconsole
      - -server=1
      - -rpcbind=0.0.0.0:48332
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=btc
      - -rpcpassword=btc
      - -txindex=1
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -listen=1
      # Persistent peers: on testnet4 a CPU-mined block loses a same-height tie to a
      # better-connected miner unless it propagates fast, so this node boots wired to a
      # set of stable, well-connected full nodes rather than relying on the ~10
      # auto-managed outbound slots alone. -addnode connections persist and reconnect.
      # The two DNS-seed hostnames self-heal if the pinned IPs churn; the IPs are the
      # @wiz infrastructure cluster and durable cloud nodes (curated 2026-09-01, all
      # full nodes serving testnet4's P2P port 48333). scripts/btc_p2p_push.py adds a
      # submission-time fan-out on top of these.
      #
      # First, the project's own testnet4 node (this file, deployed on the 216.230.225.43
      # host, P2P published on 48333). Running this compose on a laptop peers it with that
      # node directly; on the 216.230.225.43 host itself Core detects the self-connection by
      # nonce and drops it, so the entry is harmless there.
      - -addnode=216.230.225.43:48333
      - -addnode=seed.testnet4.bitcoin.sprovoost.nl
      - -addnode=seed.testnet4.wiz.biz
      - -addnode=103.165.192.202:48333
      - -addnode=103.165.192.206:48333
      - -addnode=103.165.192.208:48333
      - -addnode=103.165.192.211:48333
      - -addnode=103.99.168.207:48333
      - -addnode=103.99.168.211:48333
      - -addnode=18.204.178.177:48333
      - -addnode=3.235.25.166:48333
      - -addnode=208.73.202.78:48333
      - -addnode=50.116.43.120:48333
      - -addnode=45.94.168.5:48333
      - -addnode=89.58.9.219:48333
      # ZMQ new-block notifications (Core's conventional port), for subscribers on the host.
      - -zmqpubhashblock=tcp://0.0.0.0:28332
    ports:
      - "127.0.0.1:48332:48332" # JSON-RPC
      - "127.0.0.1:28332:28332" # ZMQ hashblock, loopback only
      - "48333:48333" # P2P, public: inbound peers propagate our mined blocks (and BIP-157 clients)
    volumes:
      - bitcoind-testnet4-data:/home/bitcoin/.bitcoin
    networks:
      - rose-net

  # The dev web UI (scripts/rose-gui), a same-origin proxy in front of rose's RPC.
  #
  # It takes its credentials from the mounted rose config, but NOT the address: that config's
  # `[rpc] bind` is 127.0.0.1, which inside this container is the container's own loopback.
  # --rpc-url overrides just the address. host.docker.internal is the host as seen from a
  # container on Docker Desktop (macOS/Windows); on Linux, the extra_hosts line below maps it
  # to the bridge gateway, which Docker Desktop provides on its own.
  #
  # For that to resolve, the host rose must listen past loopback - it is reached on the bridge
  # interface, not 127.0.0.1. On a laptop `--rpcbind 0.0.0.0` is the simple answer: it exposes
  # the RPC to the LAN behind the RPC password, acceptable for valueless testnet4 coins. On an
  # INTERNET-FACING host bind the docker bridge gateway alone instead, which is what
  # host-gateway resolves to - `--rpcbind 172.17.0.1`, or whatever
  # `docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'` prints - so the
  # port is reachable from containers and from nowhere else. Do not carry either shape to
  # mainnet; run the UI on the host network there (see docker-compose.btc-mainnet.yml).
  rose-gui:
    build:
      context: ../scripts/rose-gui
      dockerfile: Dockerfile
    container_name: rose-gui-testnet4
    restart: unless-stopped
    environment:
      # Required: both testnet4 configs ship the CHANGE-ME placeholder, which rose refuses to
      # start on, so the host daemon runs with this variable in its environment and the UI
      # proxy authenticates with the same one. Set it in deploy/.env (gitignored); compose
      # refuses to start the service while it is unset or empty rather than sending a wrong
      # credential on every request.
      - ROSE_RPC_PASSWORD=${ROSE_RPC_PASSWORD:?set ROSE_RPC_PASSWORD in deploy/.env to the password the host rose runs with}
      # The name the page header shows for this machine: a bridged container's own hostname is
      # a random id, so set ROSE_GUI_MACHINE (e.g. to `hostname`'s output) in deploy/.env.
      - ROSE_GUI_MACHINE=${ROSE_GUI_MACHINE:-}
    ports:
      - "127.0.0.1:8080:8080"  # UI on loopback only for dev
    volumes:
      # Both testnet4 configs, so one service covers either backend (see the env vars below).
      - ./rose.btc-testnet4.toml:/config/rose.btc-testnet4.toml:ro
      - ./rose.btc-testnet4-kyoto.toml:/config/rose.btc-testnet4-kyoto.toml:ro
      # The source, over the image's copy, so an edit is live without a rebuild (index.html
      # on the next page load, serve.py via --reload; see the mainnet file).
      - ../scripts/rose-gui:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rose-net
    command:
      # Defaults serve this stack's own premise: full mode against the bitcoind above. For a
      # kyoto rose instead, which needs no bitcoind at all:
      #   ROSE_GUI_CONF=rose.btc-testnet4-kyoto.toml ROSE_GUI_RPC_PORT=48242 \
      #     docker compose -f deploy/docker-compose.btc-testnet4.yml up -d rose-gui
      # The port must match the chosen config's [rpc] port - only the host part is overridden.
      - --conf=/config/${ROSE_GUI_CONF:-rose.btc-testnet4.toml}
      - --reload
      - --bind=0.0.0.0
      - --port=8080
      - --rpc-url=http://host.docker.internal:${ROSE_GUI_RPC_PORT:-48232}

networks:
  rose-net:
    driver: bridge

volumes:
  bitcoind-testnet4-data:
