# Development-only Bitcoin Core **testnet4** node, for testing zecd's BDK engine (the
# off-by-default `bitcoin` cargo feature) with real - valueless - testnet4 coins.
#
# The public-testnet sibling of docker-compose.btc-regtest.yml (same image pin, same
# credential shape; see docker-compose.btc-testnet3.yml for the other public testnet).
# Not part of the self-hosted deployment example (docker-compose.yml) and not used by the
# regtest harness. Unlike regtest there is nothing to mine: the node syncs the public
# testnet4 chain (BIP 94; small - a few GB - so the initial sync is quick) and you fund
# the wallet from a testnet4 faucet (e.g. mempool.space/testnet4).
#
# The node serves:
#   - JSON-RPC on 48332 (bitcoind's testnet4 default - exactly where a testnet4 zecd's
#     bare `server = "bitcoind"` token resolves to)
#   - compact block filters over P2P on 48333 (-blockfilterindex + -peerblockfilters,
#     what zecd's kyoto/BIP-157 light mode peers with: server = "kyoto://127.0.0.1:48333")
#   - -txindex, so getrawtransaction answers for any confirmed tx
#
# The image is pinned to Bitcoin Core 30.2, in lockstep with the regtest stack and the CI
# `btc-e2e` job (provenance: deploy/bitcoin-core/README.md). Keep the pins together when
# bumping.
#
# Usage:
#   docker compose -f deploy/docker-compose.btc-testnet4.yml up -d
#   alias bcli4='docker compose -f deploy/docker-compose.btc-testnet4.yml exec bitcoind \
#       bitcoin-cli -testnet4 -rpcuser=btc -rpcpassword=btc'
#   bcli4 getblockchaininfo     # wait for initialblockdownload: false
#
# and point a `--features bitcoin` zecd at it. deploy/zecd.btc-testnet4.toml is that
# config written out and commented (host-side, not mounted here); in outline:
#   network = "test"
#   btc_testnet = "testnet4"
#   [wallets.btc]
#   coin = "bitcoin"            # server defaults to "bitcoind" = 127.0.0.1:48332
#   [bitcoind]
#   rpc_user = "btc"
#   rpc_password = "btc"
#
# zecd keeps its own keys (keys.toml) and does all wallet tracking itself - the node
# needs no bitcoind wallet. Credentials are fixed dev values: testnet coins are valueless
# and the RPC port is published on loopback only. Do not reuse this file's shape for
# mainnet.

services:
  bitcoind:
    image: bitcoin/bitcoin:30.2
    restart: unless-stopped
    command:
      - -testnet4
      - -printtoconsole
      - -server=1
      - -rpcbind=0.0.0.0:48332
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=btc
      - -rpcpassword=btc
      - -txindex=1
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -listen=1
    ports:
      - "127.0.0.1:48332:48332" # JSON-RPC
      - "127.0.0.1:48333:48333" # P2P, for a future BIP-157 light client on the host
    volumes:
      - bitcoind-testnet4-data:/home/bitcoin/.bitcoin

volumes:
  bitcoind-testnet4-data:
