# Example self-hosted Zcash stack:  zebra (full node) -> rose.
#
# rose talks straight to zebra's JSON-RPC (the only backend).
#
# Testnet by default. For mainnet, add `-f docker-compose.mainnet.yml` to each command below (it
# swaps in the *.mainnet.* config files). The image tags are EXAMPLES - pin them to releases you
# have verified; the zebra flags can vary between versions.
#
# First run (zebra must sync enough before rose can init):
#   docker compose up -d zebra                     # let it sync
#   docker compose run --rm --entrypoint rose rose init --wallet default
#   docker compose up -d                           # start rose (and the rest)
#
# Probes:   curl localhost:9233/healthz ; curl localhost:9233/readyz
# RPC:      curl --user zec:CHANGE-ME --data-binary '{"method":"getblockchaininfo","id":1}' localhost:18232/

services:
  zebra:
    # Zebra 6.x activates ironwood (NU6.3) at the network's activation height (see zebra's source
    # and release notes). The mainnet overlay reuses this image.
    image: zfnd/zebra:6.3.0                 # pin to a verified release (zebra tags have no 'v' prefix)
    restart: unless-stopped
    command: ["zebrad", "-c", "/etc/zebra/zebrad.toml", "start"]
    volumes:
      - ./zebrad.toml:/etc/zebra/zebrad.toml:ro
      - zebra-state:/var/cache/zebra
    expose:
      - "18234"   # JSON-RPC, reached by rose over the compose network

  rose:
    build:
      context: ..
      dockerfile: Dockerfile   # StageX build is amd64-only; on ARM hosts use Dockerfile.arm64
    restart: unless-stopped
    depends_on:
      - zebra
    command: ["--datadir=/var/lib/rose", "--conf=/etc/rose/rose.toml"]
    environment:
      - RUST_LOG=info
      # Required: rose.toml ships the CHANGE-ME placeholder, which rose refuses to start on
      # (every network). Set the real one in deploy/.env (gitignored); it wins over the file.
      # Compose refuses to start the service while it is unset or empty.
      - ROSE_RPC_PASSWORD=${ROSE_RPC_PASSWORD:?set ROSE_RPC_PASSWORD in deploy/.env - rose refuses the config's CHANGE-ME placeholder}
    volumes:
      - ./rose.toml:/etc/rose/rose.toml:ro
      - rose-data:/var/lib/rose
    # Published on loopback only: RPC credentials are spend authority and travel as plaintext
    # HTTP Basic auth, so the port must not be reachable from untrusted networks. To serve other
    # hosts, front it with TLS/a reverse proxy - or, understanding the exposure, change the
    # mapping to "18232:18232".
    ports:
      - "127.0.0.1:18232:18232"   # Bitcoin-style JSON-RPC
      - "127.0.0.1:9233:9233"     # health: /healthz /readyz /status

volumes:
  zebra-state:
  rose-data:
