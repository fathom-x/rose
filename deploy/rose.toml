# rose configuration for the docker-compose stack (mounted at /etc/rose/rose.toml).
# Matches the stack's network - testnet by default; see docker-compose.yml / zebrad.toml.

network = "test"
datadir = "/var/lib/rose"
default_wallet = "default"

[wallets.default]
dir = "/var/lib/rose/default"

[backend]
# The co-located zebra full node's JSON-RPC (zebra:// = direct to zebrad).
server = "zebra://zebra:18234"
# For a MAINNET deployment, set network = "main" above and the mainnet RPC port:
# server = "zebra://zebra:8234"
# LIGHT MODE alternative - skip the co-located zebra entirely and use the public zec.rocks
# lightwalletd over TLS (testnet.zec.rocks:443 for network = "test", zec.rocks:443 for main):
# server = "zecrocks"
connect_timeout_secs = 10
reconnect_base_secs = 1
reconnect_max_secs = 60

[rpc]
# Bind to all interfaces so the published container port is reachable; protect with auth and a
# network policy / reverse proxy. Do not expose this port to untrusted networks.
bind = "0.0.0.0"
port = 18232
user = "zec"
# Placeholder: rose refuses to start while the password is `CHANGE-ME`, on every network. The
# compose stack supplies the real one as ROSE_RPC_PASSWORD (from deploy/.env, gitignored),
# which wins over this line - so leave the file alone and set the variable.
password = "CHANGE-ME"

[keys]
# age identity written by `rose init`; used to decrypt the seed for unattended sending.
age_identity = "/var/lib/rose/identity.txt"
auto_unlock = true

[sync]
interval_secs = 20

[health]
# Bind probes to all interfaces so the compose-published port (9233) is reachable.
bind = "0.0.0.0"
port = 9233
# What /readyz gates on:
#   "synced" (default) - ready only once the wallet is connected AND within `max_scan_lag` blocks
#       of the chain tip (and the enhancement backlog has drained). Strict: a from-birthday restore
#       stays not-ready until it catches up. This is the default so a client routed by readiness
#       never sees an empty or stale balance/history as authoritative while the wallet is still
#       scanning - keep it for any balance-sensitive deployment. The height gap is the meaningful
#       "caught up" signal - librustzcash's note-weighted progress ratio reaches 1.0 while
#       historical ranges are still being scanned, so it would report ready long before the wallet
#       has scanned to its own funds.
#   "scanned" - like "synced" minus the enhancement-backlog term. Balances/spendability are
#       current once scanned to the tip; only history completeness lags, bounded by
#       `getwalletinfo.enhanced_through`. For deployments that send regularly from wallets with
#       many transparent UTXOs, where the recurring spend-search backlog flaps the strict mode.
#   "connected" - ready as soon as the backend is connected and its chain tip is past this wallet's
#       birthday height (a sanity check that we're on the right, live network). Does NOT wait for
#       the wallet to finish scanning, so RPC clients can reach rose while it catches up, and
#       readiness doesn't flap during a long sync. Reads may lag the tip until caught up (the
#       per-wallet `scan_lag` in /readyz and /status shows by how much).
# readiness = "synced"
# max_scan_lag only applies in "synced" and "scanned" modes.
# max_scan_lag = 4

[log]
level = "info"
format = "json"
