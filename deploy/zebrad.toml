# Minimal Zebra config for serving rose.
# Testnet default; the mainnet variant is zebrad.mainnet.toml (used via docker-compose.mainnet.yml).
[network]
network = "Testnet"

[rpc]
# Expose JSON-RPC on the compose network for rose. 18234 is the port rose's default
# `server` expects on testnet (`zebra://127.0.0.1:18234`; 8234 on mainnet - zebra ships with
# RPC disabled, so there is no upstream default to follow). Keep this off any public
# interface.
listen_addr = "0.0.0.0:18234"
# The compose network is private and rose authenticates with user/password or not at all,
# so the cookie file isn't shared between containers.
enable_cookie_auth = false

[state]
cache_dir = "/var/cache/zebra"
