# zecd configuration for a Bitcoin **testnet4 kyoto** wallet - the BIP-157/158
# compact-block-filter light client, peering over P2P with NO RPC node and NO
# credentials. This is the light-mode twin of deploy/zecd.btc-testnet4.toml (the
# bitcoind full-node backend) over the SAME wallet: both files name one datadir, and the
# wallet DB records the wallet, not the backend, so the one testnet4 wallet is driven either
# way by choosing a config. Only one daemon at a time - both take the datadir lock.
#
# Needs a zecd built with the `bitcoin` feature (a default build refuses this file:
# `[wallets.btc] coin`/`btc_testnet` are gated behind it). Probe with:
#   cargo run --release --features bitcoin -- --conf deploy/zecd.btc-testnet4-kyoto.toml \
#       config check
#
# Bring-up (no bitcoind RPC needed for the wallet itself - see the server note):
#   cargo run --release --features bitcoin -- --conf deploy/zecd.btc-testnet4-kyoto.toml \
#       init --wallet btc --birthday 2026-08-01
#   cargo run --release --features bitcoin -- --conf deploy/zecd.btc-testnet4-kyoto.toml
#
# Add `--rpcbind 0.0.0.0` only if a container must reach it (the zecd-gui service in
# docker-compose.btc-testnet4.yml does): that publishes the RPC to the LAN behind the RPC
# password, acceptable for valueless testnet4 coins and nothing else.
#
# `--wallet btc` is REQUIRED on init (it defaults to a "default" Zcash wallet otherwise;
# see the note in deploy/zecd.btc-testnet4.toml). Kyoto cannot dial a node to anchor a
# birthday, so a freshly generated wallet defaults to **today** (funds cannot predate the
# wallet); `--birthday` takes a height or a YYYY-MM-DD date, resolved offline against the
# shipped scan floor. A restore with no birthday scans from the SegWit-activation floor.
#
# What kyoto gives up versus the bitcoind backend (behavioral, not bugs - filters cover
# blocks only, so there is no mempool):
#   - NO 0-conf receives: an incoming payment is invisible until it confirms, and
#     getbalances' untrusted_pending stays empty - unless the opt-in [mempool] feed below
#     is on.
#   - NO eviction reporting (again, unless the feed is on).
#   - NO estimatesmartfee: sends price from the [fees] oracle chain below (mempool.space,
#     then a Blockstream-style Esplora, then a peer-derived block median), or from the
#     explicit `fee_rate` argument.
# In exchange it needs no node, no credentials, and reveals no addresses to a server.

network = "test"
btc_testnet = "testnet4"
# Shared with deploy/zecd.btc-testnet4.toml on purpose (see the header). Kyoto adds its own
# header/filter store under <wallet>/btc/kyoto and leaves the BDK database alone.
datadir = "./data-btc-testnet4"
default_wallet = "btc"

[wallets.btc]
coin = "bitcoin"
# Kyoto peering. Two forms:
#   "kyoto"                    - DNS-seeded public testnet4 peers; no local node at all.
#   "kyoto://<ip>:48333"       - pin a trusted peer by IP (never a DNS name), which
#                                switches the node to whitelist-only; a comma-separated
#                                list names several as a failover set (one connection
#                                required). 48333 is the P2P port the
#                                deploy/docker-compose.btc-testnet4.yml node publishes
#                                (it runs -peerblockfilters), so this peers with a node we
#                                run while still exercising the light-client path.
# Pinned to the project's own testnet4 node (the compose file above, deployed on the
# 216.230.225.43 host). On that host itself, or beside a local copy of the stack, use
# 127.0.0.1 instead.
server = "kyoto://216.230.225.43:48333"
# server = "kyoto://127.0.0.1:48333"
# server = "kyoto"

# No [bitcoind] section: kyoto has no server and no credentials, so the cleartext-credential
# gate does not apply to it at all.

# [fees] - where a kyoto send gets its fee rate, since a filter client has no
# estimatesmartfee. The tiers are tried in order and the first answer wins; every answer,
# whatever its source, still passes the 2000 sat/vB sanity ceiling before it can price a
# send. Defaults (what this file runs with):
#
#   sources = ["mempool_space", "esplora", "peer_median"]
#
# `peer_median` is the only tier that contacts no server: it is kyoto's own BIP-133 relay
# floor and a median of recent blocks' fee averages, which is a floor and a backward-looking
# average rather than a forward estimate - hence the HTTP oracles ahead of it.
#
# The two HTTP tiers are the one time a kyoto wallet talks to a server, and what they learn
# is that this IP is about to build a transaction (never an address, an amount, or which
# transaction resulted). Two ways to spend that differently:
#
#   * Point them at instances you run, which removes the disclosure rather than accepting it:
# [fees]
# mempool_space_url = "https://mempool.internal/api/v1/fees/recommended"
# esplora_url       = "http://esplora.internal:3002/api/fee-estimates"
#
#   * Or drop them, for kyoto's original no-server posture at the cost of the estimate:
# [fees]
# sources = ["peer_median"]
#
# NB Blockstream.info runs no **testnet4** Esplora, so on this network the `esplora` tier is
# skipped unless `esplora_url` names an instance that does serve it - `zecd config check`
# reports that, rather than leaving the chain quietly one tier shorter than it reads.

# [mempool] - the opt-in 0-conf feed, OFF by default. Filters cover blocks only, so a kyoto
# wallet otherwise first sees a payment in its block; with a feed on, an incoming payment
# shows in getbalances' untrusted_pending, listtransactions and `listunspent 0` before its
# block, and a transaction that leaves the mempool is evicted at the next scan tip. Both
# sources match every transaction locally - no address or txid ever leaves the wallet -
# and `sources` is a preference order (the first that can run for this wallet wins).
# getwalletinfo.mempool_feed reports the feed's state.
#
#   * "p2p": a relay connection to the trusted node above (the kyoto:// peer; p2p_peer
#     overrides it) over the Bitcoin P2P protocol - every transaction entering its mempool,
#     at raw size (negligible here; ~150-300 MB/day on mainnet), no server involved. With
#     p2p_snapshot the client also asks for the node's whole mempool at connect and every
#     five minutes, which is what closes the pre-connect blind spot and reports evictions;
#     Bitcoin Core answers that request only for a peer with the `mempool` permission
#     (-whitelist=mempool@<this host> on the node) and DISCONNECTS one that asks without it,
#     so leave it off against a node you do not run.
# [mempool]
# sources = ["p2p"]
# p2p_snapshot = true
# p2p_snapshot_interval_secs = 300   # how stale an eviction may be; one mempool inv per request
# p2p_peer = "216.230.225.61:48333"
#
#   * "mempool_space": a websocket to a mempool.space instance
#     (wss://mempool.space/testnet4/api/v1/ws here) instead - 2-20 KB of JSON per network
#     transaction (several GB a day on mainnet) and a third party knowing a wallet is online
#     at this IP; a self-hosted instance removes the third party (ws:// allowed on a trusted
#     network; no credentials ride the socket).
# [mempool]
# sources = ["mempool_space"]
# mempool_space_url = "ws://mempool.internal:8999/api/v1/ws"

[rpc]
# zecd's own Bitcoin-Core-dialect JSON-RPC. Distinct port from the bitcoind-backed config's
# 48232 so a client (the zecd-gui compose service, say) can tell the two apart, and so nothing
# collides if the two are ever given separate datadirs and run at once.
bind = "127.0.0.1"
port = 48242
user = "btc"
# The one value in this file you MUST change: zecd refuses to start while it is the `CHANGE-ME`
# placeholder, on every network, testnet included. Either edit this line or leave it and supply
# ZECD_RPC_PASSWORD in the daemon's environment (it wins over the file) - the latter is what
# the zecd-gui compose service expects, since the UI proxy reads the same variable. Same rule
# and same variable for deploy/zecd.btc-testnet4.toml, so one value serves either config.
password = "CHANGE-ME"

[keys]
age_identity = "./data-btc-testnet4/identity.txt"
auto_unlock = true

[sync]
interval_secs = 5

[health]
# The health server reports on Zcash wallets only, so on this bitcoin-only config /status is
# empty and /readyz is trivially ready; poll getblockcount for sync state. Distinct from the
# bitcoind-backed config's 49233 for the same reason as the [rpc] port above.
port = 49243

[log]
level = "info"
format = "text"
