[package]
name = "rose-cli"
version = "0.11.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "rose: the operator's command line for the rosed wallet daemon - wallet setup and configuration subcommands, plus a bitcoin-cli-style JSON-RPC client"
repository = "https://github.com/fathom-x/rose"
readme = "README.md"
keywords = ["bitcoin", "zcash", "wallet", "json-rpc", "cli"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
# The black-box tests read sample configs from the repository root, so they stay out of the
# crate; `src/` is the whole of it.
include = ["/src/**", "/README.md"]

[[bin]]
name = "rose"
path = "src/main.rs"

[dependencies]
# The library behind rosed: the CLI cores (`init`, `config check`, ...) and the config
# resolution the RPC client borrows for the daemon's port and cookie. No `server` feature: the
# CLI never serves HTTP, so axum stays out of this binary.
# `version` beside `path`: crates.io strips the path and resolves the published `rosed`, so
# the two crates release in lockstep (publish `rosed` first).
rosed = { path = "..", version = "0.11.0", default-features = false, features = ["cli"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "string", "env"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.21", features = ["rt-multi-thread", "macros"] }
# The JSON-RPC client: one hyper connection per call, like `bitcoin-cli`.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
# The engines mirror rosed's: a `rose` serves the wallets of the daemon it is built beside.
# Bitcoin by default, Zcash opt-in, exactly as for `rosed`.
default = ["bitcoin"]
bitcoin = ["rosed/bitcoin"]
zcash = ["rosed/zcash"]
