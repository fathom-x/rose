[package]
name = "rose-petal"
version = "0.11.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "The shard holder's client for a rose enclave deployment: Locksmith's recovery protocol in pure Rust, plus a Nitro attestation checker"
repository = "https://github.com/fathom-x/rose"
readme = "README.md"
keywords = ["nitro", "enclave", "attestation", "openpgp", "shamir"]
categories = ["cryptography", "command-line-utilities"]
# The attestation fixtures travel with the crate: the library embeds AWS's root from there,
# and the test server its synthetic root, leaf and key. The bundle fixtures are test-only.
include = ["/src/**", "/README.md", "/tests/fixtures/attestation/**"]

[[bin]]
name = "rose-petal"
path = "src/bin/rose-petal.rs"

[[bin]]
name = "attestation-check"
path = "src/bin/attestation-check.rs"

[dependencies]
# The wire: plain TCP, keyfork-frame's framing, JSON bodies.
tokio = { version = "1.21", features = ["net", "time", "io-util", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
# The session: X25519 against the attested key, HKDF-SHA256, AES-256-GCM. rand 0.8 is the
# rand_core line x25519-dalek 2 and rpgp 0.21 take their randomness from.
x25519-dalek = "2"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
# The attestation document: COSE_Sign1 (coset over ciborium), the AWS chain and ES384 through
# rustls-webpki on ring. Keep ring the only provider (the daemon's TLS rule).
coset = "0.4"
ciborium = "0.2"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
ring = "0.17"
# OpenPGP: rpgp, pure Rust, MIT OR Apache-2.0. The shardfile's ECDH decryption, the share's
# inner signature, the holder's EdDSA text signature. No compression anywhere in the format.
pgp = { version = "0.21", default-features = false }
# A locked holder keyring asks for its passphrase on the terminal.
rpassword = "7"
# attestation-check reads bootproofd's base64 document and a base64 nonce.
base64 = "0.22"

[dev-dependencies]
# The crate itself with its test server, so the black-box tests of the binaries (tests/cli.rs)
# have an enclave stand-in to talk to; cargo unifies this into the test build only.
rose-petal = { path = ".", features = ["test-server"] }
tempfile = "3"
# The differential oracle for the canonical CBOR the bundle hash is computed over: upstream
# hashes with serde_cbor, whose Value ordering `cbor.rs` reproduces. Never a normal dependency
# (unmaintained; the oracle only).
serde_cbor = "0.11"
tokio = { version = "1.21", features = ["rt-multi-thread", "test-util"] }

[features]
default = []
# An in-process Locksmith stand-in that applies every upstream rule over a synthetic
# attestation, for the end-to-end tests and for a deployment's own rehearsal (`rose-petal
# test-server`). Never in a released holder binary.
test-server = []
