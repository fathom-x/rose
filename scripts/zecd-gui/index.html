<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zecd btc monitor</title>
<style>
  :root {
    --bg: #12151a; --panel: #1b2027; --line: #2b323c; --text: #dbe2ea;
    --dim: #8b96a5; --accent: #f2a900; --good: #4cc38a; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 1.5rem; max-width: 980px; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; margin: 0; color: var(--accent); }
  header { display: flex; justify-content: space-between; align-items: baseline;
           flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  #st-hash { padding-left: 1.25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 1rem; margin-bottom: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; padding: 1rem; }
  .card h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
             color: var(--dim); margin: 0 0 .75rem; }
  /* A card's heading and its headline value share one line: the heading on the left, the
     value (balance, the new-address button, the connection state) on the right. */
  .head { display: flex; justify-content: space-between; align-items: center;
          flex-wrap: wrap; gap: .5rem .75rem; margin-bottom: .75rem; }
  .head h2 { margin: 0; }
  .head .sub { margin: 0; }
  .bal { font-size: 1.5rem; }
  .bal small, .sub { color: var(--dim); font-size: .8rem; display: block; }
  .head .bal { white-space: nowrap; }
  .head .bal small { display: inline; }
  label { display: block; color: var(--dim); font-size: .8rem; margin-top: .6rem; }
  input[type=text], input[type=number] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: .45rem .5rem;
    font: inherit;
  }
  .row { display: flex; gap: .75rem; align-items: center; margin-top: .75rem; }
  button { background: var(--accent); color: #1a1200; border: 0; border-radius: 4px;
           padding: .5rem .9rem; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent);
                 border: 1px solid var(--accent); }
  #addr { word-break: break-all; margin-top: .5rem; min-height: 1.5em; }
  .msg { margin-top: .6rem; font-size: .85rem; word-break: break-all; min-height: 1.3em; }
  .msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; }
  td.amt.pos { color: var(--good); } td.amt.neg { color: var(--bad); }
  td.txid { color: var(--dim); }
  tfoot td { border-bottom: none; border-top: 2px solid var(--line); color: var(--dim); }
  .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: .75rem; }
  .tab { background: transparent; color: var(--dim); border: none; border-bottom: 2px solid transparent;
         padding: .4rem .8rem; font-size: .95rem; cursor: pointer; border-radius: 0; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  /* The account key as two columns: what it is (label, fingerprint, path) beside the key
     itself, which wraps in its own column rather than under the origin. One column again on
     a narrow screen. */
  #xpub-block { display: grid; grid-template-columns: max-content minmax(0, 1fr);
                gap: .25rem 1.5rem; align-items: start; margin-bottom: .75rem; }
  @media (max-width: 640px) { #xpub-block { grid-template-columns: 1fr; } }
  #xpub { font-family: ui-monospace, monospace; font-size: .8rem; word-break: break-all;
          align-self: end; }
  #xpub-origin { color: var(--dim); font-family: ui-monospace, monospace; font-size: .8rem;
                 min-height: 1.2em; }
  tfoot td.amt { font-weight: 600; }
  .dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%;
         background: var(--dim); margin-right: .35em; }
  .dot.ok { background: var(--good); } .dot.err { background: var(--bad); }
  button.copy { background: transparent; color: var(--dim); border: 1px solid var(--line);
                border-radius: 3px; padding: 0 .3rem; margin-left: .35rem;
                font-size: .75rem; line-height: 1.3; font-weight: 400; }
  button.copy:hover { color: var(--accent); border-color: var(--accent); }
  button.copy.done { color: var(--good); border-color: var(--good); }
  body.watchonly #sendcard { opacity: .55; }
</style>
</head>
<body>
<header>
  <div>
    <h1>&#9679; zecd &middot; bitcoin wallet</h1>
    <div id="cfgbadge" class="sub" style="margin-top:.2rem">&ndash;</div>
  </div>
</header>


<div class="grid">
  <div class="card">
    <div class="head">
      <h2>Balance</h2>
      <div class="bal" title="spendable (confirmed) balance"><span id="trusted">&ndash;</span> <small class="unit">tBTC</small></div>
    </div>
    <span class="sub">unconfirmed: <span id="pending">&ndash;</span></span>
    <span class="sub">immature: <span id="immature">&ndash;</span></span>
  </div>

  <div class="card">
    <div class="head">
      <h2>Receive</h2>
      <div class="row" style="margin-top:0">
        <button id="newaddr">new address</button>
        <button id="copyaddr" class="ghost" hidden>copy</button>
      </div>
    </div>
    <div id="addr"></div>
    <div class="msg" id="addrmsg"></div>
  </div>

  <!-- Where the wallet stands on the chain: its own synced height (what getblockcount
       answers for this wallet), and the birthday its history starts from - the recorded
       height, the anchor a kyoto first scan actually started at when it differs, and the
       birthday's calendar date (zecd's getwalletinfo `birthday` extension). -->
  <div class="card" id="statuscard">
    <div class="head">
      <h2>Status</h2>
      <span class="sub"><span class="dot" id="conn"></span> <span id="chaintext">connecting...</span></span>
    </div>
    <span class="sub">block height: <span id="st-height">&ndash;</span></span>
    <span class="sub" id="st-hash"></span>
    <span class="sub">birthday height: <span id="st-birthday">&ndash;</span></span>
    <span class="sub">birthdate: <span id="st-birthdate">&ndash;</span></span>
  </div>

  <div class="card" id="sendcard" style="grid-column: 1 / -1">
    <h2>Send</h2>
    <label>to address
      <input type="text" id="to" placeholder="tb1&hellip;" spellcheck="false"></label>
    <label>amount (<span class="unit">tBTC</span>, up to 8 decimals)</label>
    <div style="display:flex;gap:.5rem;margin-top:.15rem">
      <input type="text" id="amount" placeholder="0.0001" inputmode="decimal" style="flex:1">
      <button type="button" id="maxbtn" class="ghost" style="white-space:nowrap">send all</button>
    </div>
    <label>fee rate (sat/vB &mdash; prefilled with the estimate below; edit to override, clear to let zecd price the send itself)
      <input type="text" id="feerate" placeholder="" inputmode="decimal"></label>
    <div class="sub" id="feeest" style="margin-top:.3rem">fee estimate: &ndash;</div>
    <div class="row">
      <label style="margin:0"><input type="checkbox" id="subfee"> subtract fee from amount</label>
      <button id="send">send</button>
    </div>
    <div class="msg" id="sendmsg"></div>
  </div>
</div>

<div class="card">
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="txs" role="tab">Transactions</button>
    <button class="tab" data-tab="addrs" role="tab">Addresses</button>
  </div>
  <div id="pane-txs" class="pane">
    <div class="tablewrap">
      <table>
        <thead><tr><th>time</th><th style="text-align:right">debit</th>
                   <th style="text-align:right">credit</th>
                   <th>conf</th><th>address</th><th>txid</th>
                   <th style="text-align:right">net</th></tr></thead>
        <tbody id="txs"><tr><td colspan="7" style="color:var(--dim)">&ndash;</td></tr></tbody>
        <!-- Totals over the wallet's whole history, not just the rows shown above. -->
        <tfoot id="txtotals"></tfoot>
      </table>
    </div>
  </div>
  <div id="pane-addrs" class="pane" hidden>
    <!-- The account xpub, from listdescriptors: the receiving descriptor's key with its
         origin. Public material only; zecd refuses the private form. -->
    <div id="xpub-block">
      <div>
        <label style="margin-top:0">account xpub</label>
        <div id="xpub-origin" title="key origin: master key fingerprint / BIP 84 derivation path"></div>
      </div>
      <div id="xpub" style="color:var(--dim)">&ndash;</div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>index</th><th>address</th><th style="text-align:right">balance</th>
                   <th style="text-align:right">received</th><th>txs</th></tr></thead>
        <tbody id="addrs"><tr><td colspan="5" style="color:var(--dim)">&ndash;</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let rpcId = 0;
let spendable = 0;  // latest confirmed balance, for the "send all" button
let backend = "";   // "bitcoind" | "kyoto", from /info
let unit = "tBTC";  // "BTC" on mainnet, from /info
let watchOnly = null;  // getwalletinfo.private_keys_enabled === false; null until known

// A watch-only wallet (init --xpub) serves the whole read surface but has nothing to sign
// with: zecd answers every send with -4. Rather than let the user fill in a form that can
// only fail, say so at the top of the page and disable the send controls. Re-evaluated on
// every refresh, so a wallet swapped behind the proxy is reflected without a reload.
const SEND_CONTROLS = ["to", "amount", "maxbtn", "feerate", "subfee", "send"];
function setWatchOnly(flag) {
  if (flag === watchOnly) return;
  const changed = watchOnly !== null;  // false on the first refresh, which merely learns it
  watchOnly = flag;
  document.body.classList.toggle("watchonly", flag);
  for (const id of SEND_CONTROLS) $(id).disabled = flag;
  $("sendmsg").className = "msg";
  $("sendmsg").textContent = flag ? "watch-only wallet: sending is disabled" : "";
  if (changed || flag) loadInfo();  // the header badge names the mode too
}

// One JSON-RPC call through the same-origin proxy. `raw` maps a placeholder
// string in params to raw JSON text spliced into the body after stringify -
// used for amounts, so what zecd parses is exactly the decimal the user typed
// (zecd is strict about 8-dp amounts; no float round-trip on the send path).
async function rpc(method, params = [], raw = {}) {
  let body = JSON.stringify({ jsonrpc: "1.0", id: ++rpcId, method, params });
  for (const [ph, text] of Object.entries(raw)) body = body.replace(`"${ph}"`, text);
  const resp = await fetch("/rpc", {
    method: "POST", headers: { "Content-Type": "application/json" }, body,
  });
  let parsed;
  try { parsed = JSON.parse(await resp.text()); }
  catch { throw new Error(`HTTP ${resp.status} from zecd`); }
  if (parsed.error) throw new Error(`${parsed.error.message} (code ${parsed.error.code})`);
  return parsed.result;
}

const fmt = v => Number(v).toFixed(8);
// Amounts are 8-dp decimals; sum them as integer satoshis so a long history cannot
// accumulate float drift, then format the integer back to 8 dp.
const toSats = v => Math.round(Number(v) * 1e8);
const fmtSats = n => (n < 0 ? "-" : "") + (Math.abs(n) / 1e8).toFixed(8);
const short = (s, n = 12) => s && s.length > n ? s.slice(0, n) + "..." : (s || "");
const copyBtn = v => v ? `<button class="copy" data-copy="${v}" title="copy">⧉</button>` : "";

// One delegated handler covers the copy buttons in every re-rendered table row.
document.addEventListener("click", async e => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  await navigator.clipboard.writeText(btn.dataset.copy);
  btn.classList.add("done"); btn.textContent = "✓";
  setTimeout(() => { btn.classList.remove("done"); btn.textContent = "⧉"; }, 1200);
});

// The Addresses tab: the account xpub (the receiving descriptor's origin-qualified key,
// e.g. [d34db33f/84'/1'/0']tpub...) and every address the wallet has handed out, by index.
function renderAddresses(received, descriptors, unspent) {
  const ext = descriptors && descriptors.descriptors
    ? descriptors.descriptors.find(d => !d.internal) : null;
  if (ext) {
    // desc = wpkh([<fingerprint>/84'/c'/0']<xpub>/0/*)#checksum: the bracketed key origin
    // goes under the label in the first column, the key itself in the second.
    const m = /\[([^\]]+)\]([A-Za-z0-9]+)/.exec(ext.desc);
    $("xpub").style.color = "";
    // Origin is "<fingerprint>/<path>": the master key fingerprint (identifies the seed the
    // key came from) and the hardened BIP 84 path down to this account.
    const [fp, ...path] = (m ? m[1] : "").split("/");
    // All zeros is not a fingerprint: it is what zecd records for a bare xpub import
    // (init --xpub without the [fingerprint/path] origin), since the master key's
    // fingerprint cannot be recovered from an account key. Say so rather than show a
    // value that looks real.
    const fpText = fp === "00000000"
      ? `<span title="the xpub was imported bare, without its key origin; the master key fingerprint is not recoverable from an account key">undefined</span>`
      : fp;
    $("xpub-origin").innerHTML = m
      ? `fingerprint: ${fpText}<br>path: m/${path.join("/")}`
      : "";
    $("xpub").innerHTML = m
      ? `${m[2]}${copyBtn(m[2])}`
      : `${ext.desc}${copyBtn(ext.desc)}`;
  } else {
    $("xpub").style.color = "var(--dim)";
    $("xpub-origin").innerHTML = "";
    $("xpub").textContent = "unavailable (listdescriptors failed)";
  }
  const balance = new Map();   // address -> unspent satoshis
  for (const u of unspent || []) balance.set(u.address, (balance.get(u.address) || 0) + toSats(u.amount));
  const rows = (received || []).slice().sort((a, b) => a.address_index - b.address_index)
    .map(a => {
      const bal = balance.get(a.address) || 0;
      return `<tr>
        <td>${a.address_index ?? ""}</td>
        <td title="${a.address}">${a.address}${copyBtn(a.address)}</td>
        <td class="amt ${bal > 0 ? "pos" : ""}" style="text-align:right">${unspent ? fmtSats(bal) : "?"}</td>
        <td style="text-align:right">${fmt(a.amount)}</td>
        <td>${(a.txids || []).length}</td>
      </tr>`;
    });
  $("addrs").innerHTML = rows.length ? rows.join("")
    : `<tr><td colspan="5" style="color:var(--dim)">${received ? "no addresses issued yet" : "unavailable (listreceivedbyaddress failed)"}</td></tr>`;
}

async function refresh() {
  try {
    const [balances, height, hash, txs, info, received, descriptors, unspent] = await Promise.all([
      rpc("getbalances"),
      rpc("getblockcount"),
      rpc("getbestblockhash"),
      // The whole history in one call: the table shows the newest rows, the footer
      // sums every transfer to and from the wallet.
      rpc("listtransactions", ["*", 1000000]),
      rpc("getwalletinfo"),
      // Every issued receiving address with its index (include_empty), and the public
      // descriptors for the xpub. Both are bitcoin-wallet methods; a failure here must not
      // take the transactions tab down with it.
      rpc("listreceivedbyaddress", [0, true]).catch(() => null),
      rpc("listdescriptors").catch(() => null),
      // Per-address balances: every unspent output (0-conf included), summed by address.
      rpc("listunspent", [0]).catch(() => null),
    ]);
    setWatchOnly(info.private_keys_enabled === false);
    spendable = Number(balances.mine.trusted);
    $("trusted").textContent = fmt(balances.mine.trusted);
    $("pending").textContent = fmt(balances.mine.untrusted_pending);
    $("immature").textContent = fmt(balances.mine.immature);
    $("conn").className = "dot ok";
    // upstream_connected is zecd's per-wallet signal for the chain source; false means a
    // hung or unreachable node has been noticed and the heights shown are the last known.
    $("chaintext").textContent =
      info.upstream_connected === false ? "disconnected" : "connected";
    // The Status card. The tip hash by its tail: a mainnet hash opens with ~19 zeros of
    // proof of work, so a leading prefix shows nothing distinguishing; the full hash rides on
    // the tooltip, with the shared copy button beside it (the document-level click handler
    // covers it). Height, hash and the fixed suffix are all safe to inline; the hash is
    // validated hex.
    $("st-height").textContent = Number(height);
    $("st-hash").innerHTML = /^[0-9a-f]{64}$/.test(hash || "")
      ? `<span title="${hash}">...${hash.slice(-12)}</span>${copyBtn(hash)}`
      : "";
    // The wallet birthday (zecd's getwalletinfo extension): the recorded height, and - on
    // kyoto - the anchor the first scan actually started from once resolved, which is the
    // block that decides how much history this wallet can have seen. The date is the
    // birthday's UTC day when zecd knows it (the operator's, or the shipped table's).
    const b = info.birthday || {};
    if (Number.isInteger(b.height)) {
      const a = b.anchor;
      const anchorNote = a && Number.isInteger(a.height) && a.height !== b.height
        ? ` (anchor ${a.height})` : "";
      const tip = a && /^[0-9a-f]{64}$/.test(a.hash || "")
        ? `scan anchor ${a.height} ${a.hash}` : "no scan anchor recorded yet";
      $("st-birthday").innerHTML = `<span title="${tip}">${b.height}${anchorNote}</span>`;
      if (Number.isInteger(b.time)) {
        const iso = new Date(b.time * 1000).toISOString();
        $("st-birthdate").textContent = iso.slice(0, 10) + " (UTC)";
        $("st-birthdate").title = iso.replace("T", " ").slice(0, 19) + " UTC";
      } else {
        $("st-birthdate").textContent = "unknown";
        $("st-birthdate").title = "";
      }
    } else {
      $("st-birthday").textContent = "\u2013";
      $("st-birthdate").textContent = "\u2013";
    }

    // A fee belongs to the transaction as a whole (the surplus of its inputs over its
    // outputs), not to any recipient row - Core merely repeats the transaction's `fee` on
    // every send entry it fans out to. So each funded transaction gets one synthetic row
    // of its own, a debit labelled "transaction fee", placed just before its send rows in
    // history order (below them once the list is shown newest first).
    const entries = [];
    const feeRowFor = new Set();
    for (const tx of txs) {
      const sats = toSats(tx.amount);
      if (tx.fee !== undefined && sats < 0 && !feeRowFor.has(tx.txid)) {
        feeRowFor.add(tx.txid);
        const fee = -toSats(tx.fee);
        entries.push({ tx: { ...tx, address: "transaction fee" }, debit: fee, credit: 0,
                       net: -fee, synthetic: true });
      }
      entries.push({ tx, debit: sats < 0 ? -sats : 0, credit: sats >= 0 ? sats : 0, net: sats });
    }
    const rows = entries.slice(-25).reverse().map(({ tx, debit, credit, net, synthetic }) => {
      const when = tx.time ? new Date(tx.time * 1000).toLocaleString() : "";
      return `<tr>
        <td>${when}</td>
        <td class="amt neg" style="text-align:right">${debit ? fmtSats(debit) : ""}</td>
        <td class="amt pos" style="text-align:right">${credit ? fmtSats(credit) : ""}</td>
        <td>${tx.confirmations ?? 0}</td>
        <td title="${tx.address || ""}">${synthetic ? tx.address : short(tx.address, 18) + copyBtn(tx.address)}</td>
        <td class="txid" title="${tx.txid}">${short(tx.txid)}${copyBtn(tx.txid)}</td>
        <td class="amt ${net < 0 ? "neg" : "pos"}" style="text-align:right">${fmtSats(net)}</td>
      </tr>`;
    });
    $("txs").innerHTML = rows.length ? rows.join("")
      : `<tr><td colspan="7" style="color:var(--dim)">no transactions yet</td></tr>`;
    // Footer: each column summed over the whole history (fees are debits, on their own
    // rows); net = credits - debits, which is what the wallet's balance should equal once
    // everything confirms.
    const sum = key => entries.reduce((acc, e) => acc + e[key], 0);
    const outSats = sum("debit"), inSats = sum("credit");
    const net = inSats - outSats;
    $("txtotals").innerHTML = txs.length ? `<tr>
        <td>Total</td>
        <td class="amt neg" style="text-align:right" title="sum of debits, fees included">${fmtSats(outSats)}</td>
        <td class="amt pos" style="text-align:right" title="sum of credits">${fmtSats(inSats)}</td>
        <td colspan="3"></td>
        <td class="amt ${net < 0 ? "neg" : "pos"}" style="text-align:right" title="credits - debits">${fmtSats(net)}</td>
      </tr>` : "";
    renderAddresses(received, descriptors, unspent);
  } catch (e) {
    $("conn").className = "dot err";
    $("chaintext").textContent = e.message;
  }
}

// Which config/backend this proxy is serving, shown in the header so it's always
// clear whether you're on the bitcoind full node or a kyoto light client (they
// behave differently: no 0-conf receives and no bitcoind fee estimate on kyoto).
async function loadInfo() {
  try {
    const i = await (await fetch("/info")).json();
    backend = i.backend;
    unit = (i.network === "main" || i.network === "mainnet") ? "BTC" : "tBTC";
    for (const el of document.querySelectorAll(".unit")) el.textContent = unit;
    $("to").placeholder = unit === "BTC" ? "bc1\u2026" : "tb1\u2026";
    const mode = watchOnly ? " · watch-only" : "";
    $("cfgbadge").textContent =
      `${i.network} · ${i.backend} · ${i.wallet}${mode}  (${i.conf})`;
    document.title = `zecd btc – ${i.network}/${i.backend}${mode}`;
    refreshFee();
  } catch (e) { $("cfgbadge").textContent = ""; }
}

// The fee estimate is served by the proxy, mirroring where the wallet gets its
// rate: bitcoind's estimatesmartfee on the bitcoind backend, the [fees] oracle
// chain on kyoto - already rounded to the whole sat/vB zecd would pay.
//
// The estimate is PREFILLED into the fee-rate field and sent as sendtoaddress's
// explicit fee_rate, so the send pays exactly the number the page showed rather
// than whatever zecd re-estimates seconds later. Refreshes keep overwriting the
// field only while it still holds a prefilled value (data-auto); a value the user
// typed is left alone. Two cases deliberately do NOT prefill: the proxy's own
// test-network fallback (a made-up 1 sat/vB, which zecd applies itself where it is
// legal and refuses on mainnet), and no estimate at all - then an auto-filled
// field is cleared so a blank send lets zecd price it (on kyoto, from the
// peer-derived estimate the page cannot see).
function setFeePrefill(value) {
  const f = $("feerate");
  if (f.value && !f.dataset.auto) return;  // user-typed: keep it
  if (value == null) {
    f.value = ""; delete f.dataset.auto; f.placeholder = "";
    return;
  }
  f.value = String(value); f.dataset.auto = "1";
}
async function refreshFee() {
  try {
    const r = await (await fetch("/feerate")).json();
    if (r.error) {
      $("feeest").textContent = "fee estimate: unavailable (" + r.error + ")";
      setFeePrefill(null);
      return;
    }
    if (r.sat_per_vb != null) {
      const src = r.source === "fallback" ? "testnet fallback"
                : r.source === "estimatesmartfee" ? `node, target ~${r.blocks} blocks`
                : r.source || "estimate";
      $("feeest").textContent = `fee estimate: ${r.sat_per_vb} sat/vB (${src})`
        + (r.note ? ` - ${r.note}` : "");
      setFeePrefill(r.source === "fallback" ? null : r.sat_per_vb);
    } else {
      $("feeest").textContent = "fee estimate: " + (r.note || "unavailable");
      setFeePrefill(null);
    }
  } catch (e) {
    $("feeest").textContent = "fee estimate: unavailable";
    setFeePrefill(null);
  }
}
// Typing (or clearing) the field makes it the user's; the next refresh leaves it alone.
$("feerate").addEventListener("input", () => { delete $("feerate").dataset.auto; });

$("newaddr").onclick = async () => {
  $("addrmsg").textContent = "";
  try {
    const a = await rpc("getnewaddress");
    $("addr").textContent = a;
    $("copyaddr").hidden = false;
  } catch (e) {
    $("addrmsg").className = "msg err"; $("addrmsg").textContent = e.message;
  }
};
$("copyaddr").onclick = () => navigator.clipboard.writeText($("addr").textContent);

// "send all": fill the amount with the whole spendable balance and force
// subtract-fee on (draining the wallet needs the fee taken out of the amount,
// or there is nothing left to pay it). The user still reviews and hits Send.
$("maxbtn").onclick = () => {
  const msg = $("sendmsg");
  if (!(spendable > 0)) { msg.className = "msg err"; msg.textContent = "no spendable balance"; return; }
  $("amount").value = fmt(spendable);   // exact 8dp of the confirmed balance
  $("subfee").checked = true;
  msg.className = "msg"; msg.textContent = "amount set to full balance; fee will be taken from it";
};

$("send").onclick = async () => {
  const msg = $("sendmsg");
  msg.className = "msg"; msg.textContent = "";
  if (watchOnly) { msg.className = "msg err"; msg.textContent = "watch-only wallet: sending is disabled"; return; }
  const to = $("to").value.trim();
  const amount = $("amount").value.trim();
  const feerate = $("feerate").value.trim();
  if (!to) { msg.className = "msg err"; msg.textContent = "recipient address required"; return; }
  if (!/^\d+(\.\d{1,8})?$/.test(amount) || Number(amount) <= 0) {
    msg.className = "msg err"; msg.textContent = "amount must be a positive decimal with at most 8 places"; return;
  }
  if (feerate && !/^\d+(\.\d{1,3})?$/.test(feerate)) {
    msg.className = "msg err"; msg.textContent = "fee rate must be sat/vB with at most 3 decimals"; return;
  }
  // sendtoaddress "address" amount comment comment_to subtractfeefromamount
  //               replaceable conf_target estimate_mode avoid_reuse fee_rate
  const params = [to, "__AMT__", null, null, $("subfee").checked];
  const raw = { __AMT__: amount };
  if (feerate) { params.push(null, null, null, null, "__FEE__"); raw.__FEE__ = feerate; }
  if (!confirm(`Send ${amount} ${unit} to\n${to}?`)) return;
  $("send").disabled = true; msg.textContent = "sending...";
  try {
    const txid = await rpc("sendtoaddress", params, raw);
    msg.className = "msg ok"; msg.textContent = `sent: ${txid}`;
    $("to").value = ""; $("amount").value = "";
    refresh();
  } catch (e) {
    msg.className = "msg err"; msg.textContent = e.message;
  } finally {
    $("send").disabled = false;
  }
};

loadInfo();  // sets backend, then kicks the first fee refresh
refresh();
setInterval(refresh, 5000);
setInterval(refreshFee, 30000);  // fee estimate changes slowly; poll less often

// Tabs: one pane visible at a time; the choice is not persisted.
for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    for (const t of document.querySelectorAll(".tab")) t.classList.toggle("active", t === tab);
    for (const pane of document.querySelectorAll(".pane")) pane.hidden = pane.id !== `pane-${tab.dataset.tab}`;
  });
}
</script>
</body>
</html>
